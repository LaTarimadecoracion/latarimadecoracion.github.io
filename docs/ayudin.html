<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        // Redirect to main site with ayudin section active if loaded directly (not in an iframe)
        if (window.self === window.top) {
            var basePath = '/';
            var segments = window.location.pathname.split('/').filter(Boolean);
            if (segments.length > 0 && segments[0].toLowerCase() === 'latarimadecoracion.github.io') {
                basePath = '/latarimadecoracion.github.io/';
            }
            window.location.replace(window.location.origin + basePath + '?view=ayudin');
        }
    </script>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JXNJV3XERK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-JXNJV3XERK');
    </script>

    
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://latarimadecoracion.github.io/ayudin.html">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ayudin - Herramientas y Guías | LA TARIMA</title>
    
    
    <meta name="theme-color" content="#FAF9F6">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="img/icon-180.png">

    
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ayudin - Herramientas y Guías | LA TARIMA">
    <meta property="og:description" content="Encontrá herramientas, calculadoras y guías útiles para carpinteros y emprendedores, organizados por rubros.">
    <meta property="og:image" content="https://latarimadecoracion.github.io/img/logo_provisional.png">
    <meta property="og:url" content="https://latarimadecoracion.github.io/ayudin.html">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    
    <link rel="stylesheet" href="css/style.css?v=25">
    <link rel="stylesheet" href="css/ayudin.css?v=1">
</head>
<body>

    
    <script>
        (function() {
            try {
                // Temáticas
                var userSelected = localStorage.getItem('userSelectedTheme');
                var localTheme = localStorage.getItem('activeTheme');
                var themeToApply = userSelected || localTheme || 'classic';
                if (themeToApply && themeToApply !== 'classic') {
                    document.body.classList.add('theme-' + themeToApply);
                }
            } catch(e) {}
            
            // Iframe detection
            if (window.self !== window.top) {
                document.body.classList.add('in-iframe');
            }
        })();
    </script>

    
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    
    <header class="main-header-bar">
        <a href="./" class="back-nav-btn" title="Volver al Inicio">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        
        <div class="header-titles-wrapper">
            <h1 class="brand-title">LA TARIMA</h1>
            <p class="brand-subtitle">Ayudín para Emprendedores</p>
        </div>
    </header>

    <main class="ayudin-container" id="app-container">
        
        
        <div id="ayudin-rubros-tabs" class="rubros-tabs-bar" style="margin-top: 15px; margin-bottom: 10px;">
            
        </div>

        <h2 class="ayudin-section-title">
            <span class="material-symbols-outlined" id="section-icon">handyman</span>
            <span id="section-title-text">Herramientas Útiles</span>
        </h2>

        
        <div id="ayudin-grid-container" class="ayudin-grid">
            
        </div>

        
        <div id="ayudin-empty-state" class="catalog-empty-state" style="display: none; padding: 3rem 1rem;">
            <span class="material-symbols-outlined">extension_off</span>
            <h3>No hay herramientas cargadas</h3>
            <p>Todavía no agregamos recursos para este rubro. ¡Volvé pronto!</p>
        </div>

    </main>

    
    <div id="ayudin-detail-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-height: 85vh; display: flex; flex-direction: column;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 1.25rem; gap: 16px;">
                <div>
                    <span id="modal-rubro-badge" style="background-color: var(--secondary-color); color: var(--text-main); font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 12px; font-family: var(--font-main); text-transform: uppercase;">Rubro</span>
                    <h3 id="modal-detail-title" style="font-size: 1.2rem; margin: 4px 0 0 0; font-weight:800; color:var(--text-main); line-height: 1.3;">Título de la Guía</h3>
                </div>
                <button type="button" id="btn-close-ayudin-modal" class="btn-outline" style="padding:0.4rem 0.8rem; width:auto; font-size:0.85rem; border-radius: 12px; display: flex; align-items: center; justify-content: center; min-height: unset; cursor: pointer;">
                    <span class="material-symbols-outlined" style="font-size: 20px;">close</span>
                </button>
            </div>
            
            <div id="modal-detail-content" style="overflow-y: auto; flex-grow: 1; padding-right: 4px; box-sizing: border-box;">
                
            </div>
        </div>
    </div>

    
    <script src="js/site-config.js?v=4"></script>
    <script src="js/ayudin-data.js?v=1"></script>
    
    <script src="js/ayudin.js?v=1"></script>

</body>
</html>
