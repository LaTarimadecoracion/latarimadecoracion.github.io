<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando...</title>
    <script>
        (function() {
            var pathname = window.location.pathname.toLowerCase();
            if (pathname.endsWith('/')) pathname = pathname.slice(0, -1);

            var cleanPath = pathname;
            if (cleanPath.endsWith('.html')) {
                cleanPath = cleanPath.slice(0, -5);
            }

            var isMayorista = cleanPath.endsWith('/web/mayorista') || cleanPath.endsWith('/mayorista') || cleanPath.endsWith('/mayoristas');
            var isMusica = cleanPath.endsWith('/musica') || cleanPath.endsWith('/music') || cleanPath.endsWith('/enganchados') || cleanPath.endsWith('/musicas');
            
            var basePath = '/';
            var segments = window.location.pathname.split('/').filter(Boolean);
            if (segments.length > 0) {
                // Si el primer segmento es exactamente el nombre del repositorio
                if (segments[0].toLowerCase() === 'latarimadecoracion.github.io') {
                    basePath = '/latarimadecoracion.github.io/';
                }
            }

            if (isMayorista) {
                window.location.replace(window.location.origin + basePath + 'mayorista.html');
            } else if (isMusica) {
                window.location.replace(window.location.origin + basePath + 'musica.html');
            } else {
                window.location.replace(window.location.origin + basePath);
            }
        })();
    </script>
</head>
<body>
    <p>Redireccionando...</p>
</body>
</html>
