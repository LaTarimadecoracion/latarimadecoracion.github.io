<div id="admin-dashboard-view" class="admin-section-view">
    <div style="max-width: 680px; margin: 0 auto; padding: 1rem 0;">
        <!-- Tarjeta Modo Vacaciones -->
        <div class="admin-card vacation-selector-panel" style="background: var(--admin-surface); border: 1.5px solid var(--admin-border-color); border-radius: var(--admin-radius-md); padding: 1.5rem;">
            <header class="admin-page-header" style="margin-bottom: 0.85rem; padding-bottom: 0.65rem; border-bottom: 1px solid var(--admin-border-color);">
                <h3 class="admin-header-title" style="font-size: 1.05rem; display: flex; align-items: center; gap: 8px;">
                    <span class="material-symbols-outlined" style="color: var(--admin-warning); font-size: 24px;">flight_takeoff</span>
                    <span>Modo Vacaciones</span>
                </h3>
            </header>
            <p class="admin-header-desc" style="font-size: 0.82rem; color: var(--admin-text-muted); margin-bottom: 1.25rem;">
                Activá el cartel de aviso para tus clientes informando fechas especiales o recesos, manteniendo los pedidos abiertos con precios congelados.
            </p>
            
            <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; background: var(--admin-surface-hover); padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--admin-border-color);">
                <input type="checkbox" id="admin-vacation-active" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--admin-accent);">
                <label for="admin-vacation-active" style="cursor: pointer; margin: 0; font-size: 0.9rem; font-weight: 700; color: var(--admin-text-main);">
                    Activar Cartel de Modo Vacaciones
                </label>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="admin-vacation-start-end" style="font-size: 0.78rem; font-weight: 700; margin-bottom: 4px; display: block;">Período de Vacaciones / Receso:</label>
                    <input type="text" id="admin-vacation-start-end" class="premium-input" placeholder="ej: del 1 al 15 de Septiembre" style="font-size: 0.85rem; padding: 0.5rem 0.75rem; width: 100%; box-sizing: border-box;">
                </div>
                
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="admin-vacation-deliveries" style="font-size: 0.78rem; font-weight: 700; margin-bottom: 4px; display: block;">Fecha Estimada de Entregas:</label>
                    <input type="text" id="admin-vacation-deliveries" class="premium-input" placeholder="ej: a partir del 20 de Septiembre" style="font-size: 0.85rem; padding: 0.5rem 0.75rem; width: 100%; box-sizing: border-box;">
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="admin-vacation-message" style="font-size: 0.78rem; font-weight: 700; margin-bottom: 4px; display: block;">Mensaje personalizado para los clientes:</label>
                <textarea id="admin-vacation-message" class="premium-input" style="min-height: 70px; font-size: 0.85rem; padding: 0.5rem 0.75rem; width: 100%; box-sizing: border-box; resize: vertical;" placeholder="ej: Estamos de receso en el taller, pero seguimos tomando pedidos con precios congelados."></textarea>
            </div>
            
            <button type="button" id="admin-vacation-save-btn" class="btn-primary" style="width: 100%; justify-content: center; font-size: 0.88rem; padding: 0.6rem 1rem;">
                <span class="material-symbols-outlined" style="font-size: 18px;">save</span>
                <span>Guardar Configuración de Vacaciones</span>
            </button>
        </div>
    </div>
</div>
