<!-- partials/admin/cortes/panel-simulador.html -->
<div id="cortes-modpanel-simulador" class="cortes-module-panel" style="display: none;">
    <div class="admin-card" style="background: #FFFFFF; border: 1px solid var(--admin-border-color); border-radius: var(--admin-radius-md); padding: 1.25rem; box-shadow: var(--admin-shadow-xs);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px;">
            <div>
                <h4 style="margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--admin-text-main); display: flex; align-items: center; gap: 7px;">
                    <span class="material-symbols-outlined" style="font-size: 22px; color: var(--admin-accent);">calculate</span>
                    Simulador de Prueba de Taller en Vivo
                </h4>
                <p style="margin: 3px 0 0 0; font-size: 0.8rem; color: var(--admin-text-muted);">
                    Verificá el comportamiento de los cálculos, márgenes de ganancia y viabilidad de transporte para cualquier pieza antes de guardar cambios.
                </p>
            </div>
        </div>
        
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--admin-surface-hover); padding: 1rem; border-radius: 10px; border: 1px solid var(--admin-border-color); margin-bottom: 1rem;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--admin-text-secondary);">Madera:</label>
                <select id="sim-cortes-mat" class="admin-input" style="padding: 4px 8px; font-weight: 700;" onchange="window.updateCortesAdminSimulator()">
                    <!-- Llenado dinámicamente con las maderas activas -->
                </select>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--admin-text-secondary);">Uso:</label>
                <select id="sim-cortes-uso" class="admin-input" style="padding: 4px 8px; font-weight: 700;" onchange="window.updateCortesAdminSimulator()">
                    <option value="estante">Estante (Base)</option>
                    <option value="escritorio_mesa">Tapa Escritorio / Mesa (+Acabado fino)</option>
                    <option value="escalon">Escalón (Tránsito)</option>
                </select>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--admin-text-secondary);">Largo:</label>
                <input type="number" id="sim-cortes-largo" class="admin-input" value="80" style="width: 70px;" oninput="window.updateCortesAdminSimulator()"> cm
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--admin-text-secondary);">Ancho:</label>
                <input type="number" id="sim-cortes-ancho" class="admin-input" value="30" style="width: 70px;" oninput="window.updateCortesAdminSimulator()"> cm
            </div>
        </div>

        <div style="background: #FFFFFF; padding: 1rem; border-radius: 10px; border: 1px solid var(--admin-border-color); display: flex; gap: 16px; align-items: center; font-size: 0.88rem; font-weight: 700; flex-wrap: wrap;">
            <span>Superficie: <strong id="sim-res-sup" style="color: var(--admin-text-main);">0.24 m²</strong></span>
            <span>Costo Taller: <strong id="sim-res-costo" style="color: var(--admin-text-muted);">$6.480</strong></span>
            <span>Precio Venta: <strong id="sim-res-venta" style="color: #16A34A;">$11.640</strong></span>
            <span>Margen Bruto: <strong id="sim-res-ganancia" style="color: var(--admin-accent);">+$5.160</strong></span>
            <span id="sim-res-envio" class="admin-badge-success" style="font-size: 0.78rem; padding: 4px 10px;">Apto Courier Flex</span>
        </div>
    </div>
</div>
