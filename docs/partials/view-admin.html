<!-- =============================================================================
     partials/view-admin.html
     Estructura Base Modular del Panel Admin (#view-admin)
     Los módulos y vistas internas se cargan modularmente desde partials/admin/
     ============================================================================= -->
<!-- 1. BARRA SUPERIOR HEADER ESTILO MERCADO LIBRE -->
<header class="admin-top-navbar">
    <div class="admin-brand">
        <span id="admin-topbar-icon" class="material-symbols-outlined logo-icon">shield_person</span>
        <div class="brand-text">
            <h3 id="admin-topbar-title" class="brand-title">Panel de Control</h3>
            <p class="brand-sub">La Tarima 2.0</p>
        </div>
    </div>

    <!-- Acciones del Header Superior: Publicar, Tamaño y Salir -->
    <div class="admin-navbar-actions">
        <button type="button" id="admin-github-publish-btn" class="btn-global-publish btn-publish-trigger" title="Subir Cambios a Internet">
            <span class="material-symbols-outlined">publish</span>
            <span>Publicar Web</span>
        </button>
        <span id="publish-status-msg" class="global-publish-msg publish-status-indicator" style="display: none; margin-left: 8px;"></span>

        <div class="admin-width-selector">
            <button type="button" class="admin-width-tab active" data-width="normal" title="Ancho Contenido Estándar">
                <span class="material-symbols-outlined" style="font-size: 15px; vertical-align: middle; margin-right: 2px;">width</span>Normal
            </button>
            <button type="button" class="admin-width-tab" data-width="full" title="Expandir a Pantalla Completa (100% Ancho)">
                <span class="material-symbols-outlined" style="font-size: 15px; vertical-align: middle; margin-right: 2px;">fullscreen</span>Completo
            </button>
        </div>

        <button type="button" id="btn-close-admin" class="btn-navbar-close" title="Salir del Panel Admin">
            <span class="material-symbols-outlined">logout</span>
            <span>Salir</span>
        </button>
        <button type="button" id="btn-close-admin-header" style="display: none;"></button>
    </div>
</header>

<!-- 2. BODY LAYOUT: SIDEBAR ICONOS + MAIN CONTENT -->
<div class="admin-body-wrapper">
    <!-- Sidebar Ultra Delgado con Botón Flecha Flotante Adosado -->
    <aside class="admin-sidebar-ml" id="admin-sidebar">
        <button type="button" id="btn-toggle-sidebar" class="btn-sidebar-edge-toggle" title="Desplegar / Contraer menú">
            <span class="material-symbols-outlined">chevron_right</span>
        </button>
        <nav class="admin-sidebar-nav">
            <!-- 1. Principal -->
            <button type="button" id="tab-btn-dashboard" class="admin-sidebar-btn active" data-tooltip="Dashboard">
                <span class="material-symbols-outlined">dashboard</span>
                <span class="nav-label">Dashboard</span>
            </button>

            <!-- 2. Ventas & Operaciones -->
            <button type="button" id="tab-btn-orders" class="admin-sidebar-btn" data-tooltip="Pedidos">
                <span class="material-symbols-outlined">description</span>
                <span class="nav-label">Pedidos</span>
            </button>
            <button type="button" id="tab-btn-quotes" class="admin-sidebar-btn" data-tooltip="Crear Presupuesto">
                <span class="material-symbols-outlined">request_quote</span>
                <span class="nav-label">Crear Presupuesto</span>
            </button>

            <!-- 3. Catálogo & Inventario -->
            <button type="button" id="tab-btn-catalog" class="admin-sidebar-btn" data-tooltip="Catálogo">
                <span class="material-symbols-outlined">inventory_2</span>
                <span class="nav-label">Catálogo</span>
            </button>
            <button type="button" id="tab-btn-bulk-edit" class="admin-sidebar-btn" data-tooltip="Editor Masivo">
                <span class="material-symbols-outlined">table_chart</span>
                <span class="nav-label">Editor Masivo</span>
            </button>
            <button type="button" id="tab-btn-offers" class="admin-sidebar-btn" data-tooltip="Ofertas & Combos">
                <span class="material-symbols-outlined">local_offer</span>
                <span class="nav-label">Ofertas &amp; Combos</span>
            </button>
            <button type="button" id="tab-btn-stock" class="admin-sidebar-btn" data-tooltip="Control de Stock">
                <span class="material-symbols-outlined">inventory</span>
                <span class="nav-label">Control de Stock</span>
            </button>
            <button type="button" id="tab-btn-pc-stock" class="admin-sidebar-btn" data-tooltip="Stock PC / Escáner">
                <span class="material-symbols-outlined">desktop_windows</span>
                <span class="nav-label">Stock PC / Escáner</span>
            </button>

            <button type="button" id="tab-btn-shipping" class="admin-sidebar-btn" data-tooltip="Envíos & Zonas">
                <span class="material-symbols-outlined">local_shipping</span>
                <span class="nav-label">Envíos &amp; Zonas</span>
            </button>
            <button type="button" id="tab-btn-cortes" class="admin-sidebar-btn" data-tooltip="Cortes de Madera">
                <span class="material-symbols-outlined">carpenter</span>
                <span class="nav-label">Cortes de Madera</span>
            </button>
            <button type="button" id="tab-btn-payments" class="admin-sidebar-btn" data-tooltip="Métodos de Pago">
                <span class="material-symbols-outlined">payments</span>
                <span class="nav-label">Métodos de Pago</span>
            </button>
            <button type="button" id="tab-btn-pages" class="admin-sidebar-btn" data-tooltip="Páginas & Banners">
                <span class="material-symbols-outlined">view_quilt</span>
                <span class="nav-label">Páginas &amp; Banners</span>
            </button>
            <button type="button" id="tab-btn-settings" class="admin-sidebar-btn" data-tooltip="Ajustes del Negocio">
                <span class="material-symbols-outlined">settings</span>
                <span class="nav-label">Ajustes del Negocio</span>
            </button>
            <button type="button" id="tab-btn-users" class="admin-sidebar-btn" data-tooltip="Usuarios & Permisos">
                <span class="material-symbols-outlined">group</span>
                <span class="nav-label">Usuarios &amp; Permisos</span>
            </button>
        </nav>
    </aside>

    <!-- Área de contenido principal: Submódulos inyectados limpiamente desde partials/admin/ -->
    <main class="admin-main" id="admin-main-container">
        <!-- Los módulos se cargan en paralelo vía partials-loader -->
    </main>
</div>
