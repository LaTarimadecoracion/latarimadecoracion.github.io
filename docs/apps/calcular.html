    <script>
        (function () {
            // Si no está dentro de un iframe (carga directa), redirigir a la SPA con ?view=calcular
            if (window.self === window.top) {
                const query = window.location.search;
                const path = window.location.pathname.replace(/(apps\/)?calcular(\.html)?$/, '');
                const targetUrl = window.location.origin + path + '?view=calcular' + (query ? '&' + query.substring(1) : '');
                window.location.replace(targetUrl);
                return;
            }

            // Si está dentro de un iframe (modo SPA), sincronizar clase del body para el tema, ocultar cabecera duplicada y ajustar márgenes
            if (window.self !== window.top) {
                if (window.parent && window.parent.document.body) {
                    document.body.className = window.parent.document.body.className;
                }
                const header = document.querySelector('.main-header-bar');
                if (header) header.style.display = 'none';
                
                document.body.style.paddingTop = '0';
                document.body.style.marginTop = '0';
                const appContainer = document.getElementById('app-container');
                if (appContainer) {
                    appContainer.style.paddingTop = '0';
                    appContainer.style.marginTop = '0';
                    appContainer.style.height = '100vh';
                }
            }

            const inputA = document.getElementById('medidaA');
            const inputB = document.getElementById('medidaB');
            const inputC = document.getElementById('medidaC');
            const btn = document.getElementById('btnCalcular');

            // Enter navega de A→B→C entre los inputs
            [[inputA, inputB], [inputB, inputC]].forEach(([from, to]) => {
                if (from && to) {
                    from.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') { e.preventDefault(); to.focus(); to.select(); }
                    });
                }
            });

            // Botón "Nueva medición" — limpia todo de una vez
            const btnLimpiar = document.getElementById('btnLimpiar');
            if (btnLimpiar) {
                btnLimpiar.addEventListener('click', () => {
                    inputA.value = '';
                    inputB.value = '';
                    inputC.value = '';
                    try { localStorage.removeItem('lastMedidasBC'); localStorage.removeItem('userSelectedModeloV1'); } catch(e) {}
                    const out2 = document.getElementById('resultadoCalculo');
                    const tabla = document.querySelector('#tablaBaranda tbody');
                    const resumen = document.getElementById('resumenUnificado');
                    const visor = document.getElementById('cardVisualizador');
                    if (out2) out2.style.display = 'none';
                    if (tabla) tabla.innerHTML = '';
                    if (resumen) resumen.style.display = 'none';
                    if (visor) visor.style.display = 'none';
                    inputA.focus();
                });
            }


            const out = document.getElementById('resultadoCalculo');
            const tablaBarandaBody = document.querySelector('#tablaBaranda tbody');
            const STORAGE_USER_SEL = 'userSelectedModeloV1';
            const STORAGE_KEYS = { medidas: 'lastMedidasBC' };
            let recomendadoActual = null;
            let activeModeloNombre = null;
            let vistaActual = 'recomendada';
            
            function saveUserSelection(nombre) { localStorage.setItem(STORAGE_USER_SEL, nombre || ''); }
            function loadUserSelection() { try { return localStorage.getItem(STORAGE_USER_SEL) || ''; } catch (e) { return ''; } }
            
            function loadMedidas() { try { const s = localStorage.getItem(STORAGE_KEYS.medidas); return s ? JSON.parse(s) : {}; } catch (e) { return {}; } }
            function saveMedidas(A, B, C) { localStorage.setItem(STORAGE_KEYS.medidas, JSON.stringify({ A, B, C })); }

            const resumenUnificado = document.getElementById('resumenUnificado');

            function ejecutar() {
                const A = parseFloat(inputA.value);
                const B = parseFloat(inputB.value);
                const C = parseFloat(inputC.value);
                if (isNaN(B) || isNaN(C)) {
                    out.style.display = 'none';
                    tablaBarandaBody.innerHTML = '';
                    resumenUnificado.style.display = 'none';
                    document.getElementById('cardVisualizador').style.display = 'none';
                    return;
                }
                out.style.display = 'none';

                if (C < B) {
                    tablaBarandaBody.innerHTML = '';
                    resumenUnificado.style.display = 'none';
                    document.getElementById('cardVisualizador').style.display = 'none';
                    out.style.display = 'block';
                    out.innerHTML = '<span class="error-msg">C no puede ser menor que B. Revisá las medidas.</span>';
                    return;
                }

                // ================= CONFIG DINÁMICA MODELOS =================
                const modelosConfig = [
                    { nombre: 'Clásica 45', nominal: 45, agarre: 8, soporte: 20, minAbertura: 5, targetProt: 20, rangeProt: [15, 25] },
                    { nombre: 'Clásica 60', nominal: 60, agarre: 8, soporte: 20, minAbertura: 5, targetProt: 35, rangeProt: [33, 37] },
                    { nombre: 'Montessori 45', nominal: 45, agarre: 8, soporte: 20, minAbertura: 5, targetProt: 15, rangeProt: [15, 20] },
                    { nombre: 'Simple 35', nominal: 35, agarre: 8, soporte: 7, minAbertura: 5, targetProt: 10, rangeProt: [10, 12], minProteccion: 10 }
                ];

                function calcModeloAvanzado(m) {
                    const agarreReal = B > m.agarre ? m.agarre : B;
                    const deltaB = B > m.agarre ? (B - m.agarre) : 0;
                    const nuevoC = C - deltaB;
                    let alturaIdeal = nuevoC + m.targetProt;
                    const estructuraMin = agarreReal + m.soporte + m.minAbertura;
                    if (alturaIdeal < estructuraMin) alturaIdeal = estructuraMin;
                    let abertura = alturaIdeal - (agarreReal + m.soporte);
                    if (abertura < m.minAbertura) { alturaIdeal = estructuraMin; abertura = m.minAbertura; }
                    let proteccion = alturaIdeal - nuevoC;
                    if (m.minProteccion && proteccion < m.minProteccion) {
                        alturaIdeal = nuevoC + m.minProteccion;
                        abertura = alturaIdeal - (agarreReal + m.soporte);
                        proteccion = alturaIdeal - nuevoC;
                    }
                    const [pMin, pMax] = m.rangeProt;
                    let estado = proteccion < pMin ? 'Baja' : (proteccion > pMax ? 'Alta' : 'Óptima');
                    const colorClass = estado === 'Óptima' ? 'status-optima' : (estado === 'Baja' ? 'status-baja' : 'status-alta');
                    let nota;
                    if (m.minProteccion && proteccion < m.minProteccion) nota = `Elevada para mínimo ${m.minProteccion} cm`;
                    else if (Math.abs(alturaIdeal - m.nominal) > 0.5) nota = `Ajustada desde ${m.nominal} cm`;
                    else nota = 'Sin ajuste';
                    let aberturaFormula = B - m.agarre; if (aberturaFormula < 0) aberturaFormula = 0;
                    const proteccionNominal = m.nominal - nuevoC;
                    const diff = Math.abs(proteccionNominal - m.targetProt);
                    return { ...m, agarreReal, abertura: +abertura.toFixed(1), aberturaFormula: +aberturaFormula.toFixed(1), alturaSugerida: +alturaIdeal.toFixed(1), proteccion: +proteccion.toFixed(1), estado, colorClass, nota, rango: `${pMin}–${pMax}`, proteccionNominal: +proteccionNominal.toFixed(1), diffTarget: +diff.toFixed(1) };
                }
                
                const evalAvanzado = modelosConfig.map(calcModeloAvanzado);
                window._lastEvalAvanzado = evalAvanzado;
                let cand = evalAvanzado.filter(x => x.estado === 'Óptima'); if (!cand.length) cand = evalAvanzado.slice();
                const recomendadoAv = cand.sort((a, b) => Math.abs(a.proteccion - a.targetProt) - Math.abs(b.proteccion - b.targetProt))[0];
                recomendadoActual = recomendadoAv;
                
                const filasAv = evalAvanzado.map(e => {
                    const filaClase = e.estado === 'Óptima' ? 'fila-recomendada' : 'fila-no-recommend';
                    return `
                        <tr data-modelo="${e.nombre}" class="${filaClase}">
                            <td>
                                <div class="row-title">${e.nombre}</div>
                                <div class="row-sub">Rango ${e.rango} (target ${e.targetProt})</div>
                            </td>
                            <td style="text-align:right;">
                                <div class="row-title">${e.proteccion} cm <span class="row-status ${e.colorClass}">(${e.estado})</span></div>
                                <div class="row-sub">Abertura: ${e.abertura} cm</div>

                } else {
                    if (estadoNominal === 'Óptima') {
                        evalTexto = `Este modelo en su altura estándar es <strong>adecuado</strong> porque ofrece una protección útil de <strong>${modelo.proteccionNominal} cm</strong> sobre el colchón (dentro del rango de ${modelo.rango} cm). Sin embargo, la opción oficial recomendada es más cercana al valor de seguridad ideal.`;

                    } else { // Alta
                        evalTexto = `<span class="error-msg" style="color:#b91c1c; font-weight:700;">No es ideal estándar:</span> En su altura de fábrica de ${modelo.nominal} cm, quedaría muy alto. La protección útil sobre el colchón sería de <strong>${modelo.proteccionNominal} cm</strong> (por encima del máximo recomendado de ${pMax} cm).`;

                let propuestaAltura = '';

                    <div class="summary-box-content">
                        <div class="summary-line">${evalTexto}</div>

                        <div id="desgloseIntermedio" style="margin-top:10px; font-size:0.8rem;">

            // ── Diagrama guía: resaltar cota activa al hacer foco en cada input ──
            (function initGuideInteractions() {
                const cotas = { A: 'cota-A', B: 'cota-B', C: 'cota-C' };
                const parts = { A: 'dg-tirante', B: 'dg-tirante', C: 'dg-colchon' };
                const colors = { A: '#e07c40', B: '#3b82f6', C: '#16a34a' };

                function highlightStep(step) {
                    // Resetear todas las cotas y pasos
                    Object.values(cotas).forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.style.opacity = '0.2';
                    });
                    ['dg-tirante', 'dg-colchon'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) { el.style.transition = 'filter 0.3s ease'; el.style.filter = ''; }
                    });
                    document.querySelectorAll('.guide-step').forEach(s => s.classList.remove('is-active'));

                    if (!step) return;

                    // Activar cota del diagrama
                    const cotaEl = document.getElementById(cotas[step]);
                    if (cotaEl) cotaEl.style.opacity = '1';

                    // Resaltar parte de la cama correspondiente
                    const partEl = document.getElementById(parts[step]);
                    if (partEl) partEl.style.filter = `drop-shadow(0 0 5px ${colors[step]}88)`;

                    // Resaltar el paso
                    const stepEl = document.getElementById('step-' + step);
                    if (stepEl) stepEl.classList.add('is-active');
                }

                // Bindings de foco en cada input
                [
                    { input: inputA, step: 'A' },
                    { input: inputB, step: 'B' },
                    { input: inputC, step: 'C' }
                ].forEach(({ input, step }) => {
                    if (!input) return;
                    input.addEventListener('focus', () => highlightStep(step));
                    input.addEventListener('blur', () => highlightStep(null));
                    // También activar al hacer clic en el contenedor del paso
                    const stepEl = document.getElementById('step-' + step);
                    if (stepEl) {
                        stepEl.addEventListener('click', (e) => {
                            if (!e.target.classList.contains('btn-stepper')) {
                                input.focus();
                            }
                        });
                    }
                });

                // Botones +/-
                document.querySelectorAll('.btn-stepper').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const fieldId = btn.getAttribute('data-field');
                        const dir = parseFloat(btn.getAttribute('data-dir'));
                        const field = document.getElementById(fieldId);
                        if (!field) return;
                        const currentVal = parseFloat(field.value) || 0;
                        const step = parseFloat(field.step) || 0.5;
                        const newVal = Math.max(0, Math.round((currentVal + dir * step) * 10) / 10);
                        field.value = newVal;
                        field.dispatchEvent(new Event('input', { bubbles: true }));
                        field.dispatchEvent(new Event('change', { bubbles: true }));
                    });
                });
            })();

            function dibujarBaranda() {
                const svg = document.getElementById('diagrama');
                if (!svg) return;
                svg.innerHTML = '';
                definirMarcadores(svg);

                const B = parseFloat(inputB.value);
                const C = parseFloat(inputC.value);
                if (isNaN(B) || isNaN(C) || C < B) return;

                const evals = window._lastEvalAvanzado || [];
                let evalModelo = evals.find(m => m.nombre === activeModeloNombre);
                if (!evalModelo && evals.length > 0) {
                    evalModelo = evals[0];
                }

                const nominalHeight = evalModelo ? evalModelo.nominal : (modelosVisualizador[activeModeloNombre || 'Clásica 45']?.altoTotal || 45);
                const sugeridaHeight = evalModelo ? evalModelo.alturaSugerida : nominalHeight;
                const H = (vistaActual === 'actual') ? nominalHeight : sugeridaHeight;

                const modeloVisual = modelosVisualizador[activeModeloNombre] || modelosVisualizador['Clásica 45'];

                dibujarVistaFrente(svg, B, C, modeloVisual, H);
            }

            function dibujarVistaFrente(svg, B, C, modelo, H) {
                const largoCama = 190;
                const largoBaranda = 110;
                const posicionBaranda = 40;

                const escala = 3.5;
                const margenX = 140;
                const margenY = 60;
                const grosorColchon = C - B;
                const anchoCama = largoCama * escala;

                const nominalHeight = modelo.altoTotal;
                const agarreEfectivo = Math.min(modelo.agarre, B);
                const baseY = margenY + nominalHeight * escala;

                const anchoTotalSVG = anchoCama + margenX + 50;
                const altoTotalSVG = baseY + (B > agarreEfectivo ? B : agarreEfectivo) * escala + 50;
                
                const yRailTop = baseY - H * escala;
                const minY = Math.min(0, yRailTop - 30);
                const heightSVG = altoTotalSVG - minY;
                
                svg.setAttribute('viewBox', `0 ${minY} ${anchoTotalSVG} ${heightSVG}`);
                
                // 1. Tirante Cama (Fondo)
                const tirante = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                tirante.setAttribute('x', margenX);
                tirante.setAttribute('y', baseY - agarreEfectivo * escala);
                tirante.setAttribute('width', anchoCama);
                tirante.setAttribute('height', B * escala);
                tirante.setAttribute('fill', 'url(#gradTirante)');
                tirante.setAttribute('stroke', '#999');
                svg.appendChild(tirante);

                // 2. Colchón
                const colchon = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                colchon.setAttribute('x', margenX);
                colchon.setAttribute('y', baseY - agarreEfectivo * escala - grosorColchon * escala);
                colchon.setAttribute('width', anchoCama);
                colchon.setAttribute('height', grosorColchon * escala);
                colchon.setAttribute('fill', 'url(#gradColchon)');
                colchon.setAttribute('stroke', '#ddd');
                svg.appendChild(colchon);

                // Etiquetas de cama
                [{ text: 'TIRANTE CAMA', y: baseY - agarreEfectivo * escala + (B * escala) / 2 }, 
                 { text: 'COLCHÓN', y: baseY - agarreEfectivo * escala - (grosorColchon * escala) / 2 }].forEach(label => {
                    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    txt.setAttribute('x', margenX + anchoCama / 2);
                    txt.setAttribute('y', label.y + 5);
                    txt.setAttribute('text-anchor', 'middle');
                    txt.setAttribute('fill', '#666');
                    txt.setAttribute('font-size', '11');
                    txt.setAttribute('font-weight', 'bold');
                    txt.setAttribute('opacity', '0.5');
                    txt.textContent = label.text;
                    svg.appendChild(txt);
                });

                // 3. Baranda
                const anchoBaranda = largoBaranda * escala;
                const offsetBaranda = posicionBaranda * escala;

                const grupoBaranda = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                // Listones
                modelo.listones.forEach(liston => {
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', margenX + offsetBaranda);
                    rect.setAttribute('y', baseY - (H - liston.posicion) * escala);
                    rect.setAttribute('width', anchoBaranda);
                    rect.setAttribute('height', liston.grosor * escala);
                    rect.setAttribute('fill', 'url(#gradMaderaH)');
                    rect.setAttribute('stroke', '#8b6f47');
                    grupoBaranda.appendChild(rect);
                });

                // Parantes
                const numP = 2;
                const distBC = 13.5;
                const posP = [distBC, largoBaranda - distBC];

                if (modelo.estilo === 'reja') {
                    const pR = modelo.parantesRelleno;
                    const distL = (largoBaranda - (modelo.separacionParantes * 2) - (7 * 2));
                    const cantE = Math.ceil(distL / (pR.separacionMax + pR.grosor));
                    const distEq = distL / cantE;
                    for (let i = 1; i < cantE; i++) {
                        const posR = (modelo.separacionParantes + 7) + (i * distEq);
                        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        r.setAttribute('x', margenX + offsetBaranda + (posR - pR.grosor / 2) * escala);
                        r.setAttribute('y', baseY - (H - 4) * escala);
                        r.setAttribute('width', pR.grosor * escala);
                        r.setAttribute('height', (H - 8 - 4) * escala);
                        r.setAttribute('fill', 'url(#gradMaderaV)');
                        r.setAttribute('stroke', '#8b6f47');
                        r.setAttribute('opacity', '0.8');
                        grupoBaranda.appendChild(r);
                    }
                }

                posP.forEach(p => {
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', margenX + offsetBaranda + (p - 3.5) * escala);
                    rect.setAttribute('y', baseY - H * escala);
                    rect.setAttribute('width', 7 * escala);
                    rect.setAttribute('height', H * escala);
                    rect.setAttribute('fill', 'url(#gradMaderaV)');
                    rect.setAttribute('stroke', '#6b5537');
                    grupoBaranda.appendChild(rect);
                });

                // Etiqueta de la baranda
                const labelB = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                labelB.setAttribute('x', margenX + offsetBaranda + anchoBaranda / 2);
                labelB.setAttribute('y', baseY - (H + 4) * escala);
                labelB.setAttribute('text-anchor', 'middle');
                labelB.setAttribute('font-size', '13');
                labelB.setAttribute('font-weight', 'bold');
                labelB.setAttribute('fill', '#a67c52');
                labelB.textContent = modelo.nombre;
                grupoBaranda.appendChild(labelB);

                svg.appendChild(grupoBaranda);

                // Cota de largo
                agregarCotaHorizontal(svg, margenX + offsetBaranda, baseY + B * escala + 25, anchoBaranda, `Largo Baranda: ${largoBaranda} cm`);

                // 4. Abertura Seguridad
                const colchonY = baseY - agarreEfectivo * escala - grosorColchon * escala;
                const lastL = modelo.listones[modelo.listones.length - 1];
                const listonY = baseY - (H - (lastL.posicion + lastL.grosor)) * escala;
                const aberturaCm = (colchonY - listonY) / escala;

                let colorAbertura;
                if (aberturaCm <= 0) {
                    colorAbertura = '#16a34a';
                } else if (aberturaCm <= 5) {
                    colorAbertura = '#d97706';
                } else {
                    colorAbertura = '#dc2626';
                }
                dibujarCotaAbertura(svg, margenX + anchoCama + 30, colchonY, listonY, aberturaCm, colorAbertura);

                // 5. Protección útil
                const proteccionCm = H - agarreEfectivo - grosorColchon;
                const xProt = margenX + offsetBaranda + anchoBaranda + 20;
                
                let colorLineProt = '#16a34a';
                let colorTextProt = '#15803d';
                let markerIdProt = 'flechaVGreen';
                if (proteccionCm < 10) {
                    colorLineProt = '#dc2626';
                    colorTextProt = '#b91c1c';
                    markerIdProt = 'flechaVRed';
                }

                agregarCotaVerticalColor(
                    svg,
                    xProt,
                    Math.min(yRailTop, colchonY),
                    Math.abs(colchonY - yRailTop),
                    `Protección: ${proteccionCm.toFixed(1)} cm`,
                    colorLineProt,
                    colorTextProt,
                    markerIdProt,
                    true
                );

                // Cotas verticales
                // Total (C) at x = margenX - 105
                agregarCotaVertical(svg, margenX - 105, colchonY, C * escala, `Total (C): ${C.toFixed(1)} cm`);
                
                // Tirante (B) at x = margenX - 55
                agregarCotaVertical(svg, margenX - 55, baseY - agarreEfectivo * escala, B * escala, `Tirante (B): ${B.toFixed(1)} cm`);
                
                // Colchón (C-B) at x = margenX - 55
                agregarCotaVertical(svg, margenX - 55, colchonY, grosorColchon * escala, `Colchón: ${grosorColchon.toFixed(1)} cm`);
            }

            function dibujarVistaLateral(svg, B, C, modelo) {
                const escala = 5;
                const margenIzq = 120;
                const margenInf = 320;

                svg.setAttribute('viewBox', '0 0 500 400');

                // Piso
                const piso = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                piso.setAttribute('x1', margenIzq - 50);
                piso.setAttribute('y1', margenInf);
                piso.setAttribute('x2', margenIzq + 250);
                piso.setAttribute('y2', margenInf);
                piso.setAttribute('stroke', '#333');
                piso.setAttribute('stroke-width', '3');
                svg.appendChild(piso);

                // Tirante
                const tirante = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                tirante.setAttribute('x', margenIzq + 30);
                tirante.setAttribute('y', margenInf - B * escala);
                tirante.setAttribute('width', 150);
                tirante.setAttribute('height', B * escala);
                tirante.setAttribute('fill', '#e0e0e0');
                tirante.setAttribute('stroke', '#999');
                tirante.setAttribute('stroke-width', '2');
                svg.appendChild(tirante);

                // Colchón
                const colchon = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                colchon.setAttribute('x', margenIzq + 40);
                colchon.setAttribute('y', margenInf - C * escala);
                colchon.setAttribute('width', 130);
                colchon.setAttribute('height', (C - B) * escala);
                colchon.setAttribute('fill', 'url(#gradColchon)');
                colchon.setAttribute('stroke', '#ddd');
                colchon.setAttribute('stroke-width', '2');
                svg.appendChild(colchon);

                // Baranda
                const agarreLocal = Math.min(modelo.agarre, B);
                const baranda = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                baranda.setAttribute('x', margenIzq + 20);
                baranda.setAttribute('y', margenInf - C * escala - (modelo.altoTotal - modelo.agarre - (C - B)) * escala + (modelo.agarre - agarreLocal) * escala);
                baranda.setAttribute('width', 15);
                baranda.setAttribute('height', modelo.altoTotal * escala);
                baranda.setAttribute('fill', 'url(#gradMaderaV)');
                baranda.setAttribute('stroke', '#5d4e3a');
                baranda.setAttribute('stroke-width', '2');
                svg.appendChild(baranda);
            }

            function dibujarCotaAbertura(svg, x, y1, y2, val, color) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x); line.setAttribute('y1', y1); line.setAttribute('x2', x); line.setAttribute('y2', y2);
                line.setAttribute('stroke', color); line.setAttribute('stroke-width', '2');
                line.setAttribute('marker-start', 'url(#flechaAbertura)'); line.setAttribute('marker-end', 'url(#flechaAbertura)');
                svg.appendChild(line);

                const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                txt.setAttribute('x', x + 10); txt.setAttribute('y', (y1 + y2) / 2 + 5);
                txt.setAttribute('fill', color); txt.setAttribute('font-size', '12'); txt.setAttribute('font-weight', 'bold');
                
                const labelText = val < 0 ? `Solape: ${Math.abs(val).toFixed(1)} cm` : `Abertura: ${val.toFixed(1)} cm`;
                txt.textContent = labelText;
                svg.appendChild(txt);

                const m = document.querySelector('#flechaAbertura path');
                if (m) m.setAttribute('fill', color);
            }

            function agregarCotaHorizontal(svg, x, y, ancho, texto) {
                const grupo = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                const linea = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                linea.setAttribute('x1', x);
                linea.setAttribute('y1', y);
                linea.setAttribute('x2', x + ancho);
                linea.setAttribute('y2', y);
                linea.setAttribute('stroke', '#a67c52');
                linea.setAttribute('stroke-width', '1.5');
                linea.setAttribute('marker-start', 'url(#flechaH)');
                linea.setAttribute('marker-end', 'url(#flechaH)');
                grupo.appendChild(linea);

                const textoSVG = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                textoSVG.setAttribute('x', x + ancho / 2);
                textoSVG.setAttribute('y', y - 8);
                textoSVG.setAttribute('text-anchor', 'middle');
                textoSVG.setAttribute('font-size', '11');
                textoSVG.setAttribute('fill', '#5d4037');
                textoSVG.setAttribute('font-weight', 'bold');
                textoSVG.textContent = texto;

                const bbox = { width: texto.length * 7, height: 14 };
                const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                bg.setAttribute('x', (x + ancho / 2) - bbox.width / 2);
                bg.setAttribute('y', y - 19);
                bg.setAttribute('width', bbox.width);
                bg.setAttribute('height', bbox.height);
                bg.setAttribute('fill', 'rgba(255,255,255,0.8)');
                bg.setAttribute('rx', '3');
                grupo.appendChild(bg);
                grupo.appendChild(textoSVG);

                svg.appendChild(grupo);
            }

            function agregarCotaVerticalColor(svg, x, y, alto, texto, colorLine, colorText, markerId, alignRight = false) {
                const grupo = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                const linea = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                linea.setAttribute('x1', x);
                linea.setAttribute('y1', y);
                linea.setAttribute('x2', x);
                linea.setAttribute('y2', y + alto);
                linea.setAttribute('stroke', colorLine);
                linea.setAttribute('stroke-width', '1.5');
                linea.setAttribute('marker-start', `url(#${markerId})`);
                linea.setAttribute('marker-end', `url(#${markerId})`);
                grupo.appendChild(linea);

                const textoSVG = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                const textX = alignRight ? x + 12 : x - 12;
                textoSVG.setAttribute('x', textX);
                textoSVG.setAttribute('y', y + alto / 2 + 4);
                textoSVG.setAttribute('text-anchor', alignRight ? 'start' : 'end');
                textoSVG.setAttribute('font-size', '11');
                textoSVG.setAttribute('fill', colorText);
                textoSVG.setAttribute('font-weight', 'bold');
                textoSVG.textContent = texto;

                const bbox = { width: texto.length * 6.5, height: 14 };
                const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                const bgX = alignRight ? x + 10 : x - 15 - bbox.width;
                bg.setAttribute('x', bgX);
                bg.setAttribute('y', y + alto / 2 - 7);
                bg.setAttribute('width', bbox.width + 5);
                bg.setAttribute('height', bbox.height);
                bg.setAttribute('fill', 'rgba(255,255,255,0.85)');
                bg.setAttribute('rx', '3');
                grupo.appendChild(bg);
                grupo.appendChild(textoSVG);

                svg.appendChild(grupo);
            }

            function agregarCotaVertical(svg, x, y, alto, texto) {
                agregarCotaVerticalColor(svg, x, y, alto, texto, '#a67c52', '#5d4037', 'flechaV', false);
            }

            function definirMarcadores(svg) {
                if (document.getElementById('flechaH')) return;

                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');

                const gradH = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                gradH.id = 'gradMaderaH'; gradH.setAttribute('x1', '0%'); gradH.setAttribute('y1', '0%'); gradH.setAttribute('x2', '0%'); gradH.setAttribute('y2', '100%');
                gradH.innerHTML = '<stop offset="0%" style="stop-color:#c4a484"/><stop offset="50%" style="stop-color:#a67c52"/><stop offset="100%" style="stop-color:#8b6f47"/>';
                defs.appendChild(gradH);

                const gradV = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                gradV.id = 'gradMaderaV'; gradV.setAttribute('x1', '0%'); gradV.setAttribute('y1', '0%'); gradV.setAttribute('x2', '100%'); gradV.setAttribute('y2', '0%');
                gradV.innerHTML = '<stop offset="0%" style="stop-color:#8b6f47"/><stop offset="50%" style="stop-color:#a67c52"/><stop offset="100%" style="stop-color:#6b5537"/>';
                defs.appendChild(gradV);

                const gradColchon = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                gradColchon.id = 'gradColchon'; gradColchon.setAttribute('x1', '0%'); gradColchon.setAttribute('y1', '0%'); gradColchon.setAttribute('x2', '0%'); gradColchon.setAttribute('y2', '100%');
                gradColchon.innerHTML = '<stop offset="0%" style="stop-color:#ffffff"/><stop offset="100%" style="stop-color:#f8f0e0"/>';
                defs.appendChild(gradColchon);

                const gradTirante = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                gradTirante.id = 'gradTirante'; gradTirante.setAttribute('x1', '0%'); gradTirante.setAttribute('y1', '0%'); gradTirante.setAttribute('x2', '0%'); gradTirante.setAttribute('y2', '100%');
                gradTirante.innerHTML = '<stop offset="0%" style="stop-color:#e0e0e0"/><stop offset="100%" style="stop-color:#b0b0b0"/>';
                defs.appendChild(gradTirante);

                const markerH = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                markerH.setAttribute('id', 'flechaH'); markerH.setAttribute('markerWidth', '6'); markerH.setAttribute('markerHeight', '6');
                markerH.setAttribute('refX', '3'); markerH.setAttribute('refY', '3'); markerH.setAttribute('orient', 'auto');
                const pathH = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathH.setAttribute('d', 'M0,0 L6,3 L0,6 z'); pathH.setAttribute('fill', '#a67c52');
                markerH.appendChild(pathH); defs.appendChild(markerH);

                const markerV = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                markerV.setAttribute('id', 'flechaV'); markerV.setAttribute('markerWidth', '6'); markerV.setAttribute('markerHeight', '6');
                markerV.setAttribute('refX', '3'); markerV.setAttribute('refY', '3'); markerV.setAttribute('orient', 'auto');
                const pathV = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathV.setAttribute('d', 'M0,0 L6,3 L0,6 z'); pathV.setAttribute('fill', '#a67c52');
                markerV.appendChild(pathV); defs.appendChild(markerV);

                const markerVGreen = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                markerVGreen.setAttribute('id', 'flechaVGreen'); markerVGreen.setAttribute('markerWidth', '6'); markerVGreen.setAttribute('markerHeight', '6');
                markerVGreen.setAttribute('refX', '3'); markerVGreen.setAttribute('refY', '3'); markerVGreen.setAttribute('orient', 'auto');
                const pathVGreen = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathVGreen.setAttribute('d', 'M0,0 L6,3 L0,6 z'); pathVGreen.setAttribute('fill', '#16a34a');
                markerVGreen.appendChild(pathVGreen); defs.appendChild(markerVGreen);

                const markerVRed = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                markerVRed.setAttribute('id', 'flechaVRed'); markerVRed.setAttribute('markerWidth', '6'); markerVRed.setAttribute('markerHeight', '6');
                markerVRed.setAttribute('refX', '3'); markerVRed.setAttribute('refY', '3'); markerVRed.setAttribute('orient', 'auto');
                const pathVRed = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathVRed.setAttribute('d', 'M0,0 L6,3 L0,6 z'); pathVRed.setAttribute('fill', '#dc2626');
                markerVRed.appendChild(pathVRed); defs.appendChild(markerVRed);

                const markerAbertura = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                markerAbertura.setAttribute('id', 'flechaAbertura'); markerAbertura.setAttribute('markerWidth', '6'); markerAbertura.setAttribute('markerHeight', '6');
                markerAbertura.setAttribute('refX', '3'); markerAbertura.setAttribute('refY', '3'); markerAbertura.setAttribute('orient', 'auto');
                const pathAbertura = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathAbertura.setAttribute('d', 'M0,0 L6,3 L0,6 z');
                markerAbertura.appendChild(pathAbertura); defs.appendChild(markerAbertura);

                svg.insertBefore(defs, svg.firstChild);
            }

            // Toggles de vista y exportación del diagrama
            const btnBarandaActual = document.getElementById('btnBarandaActual');
            const btnBarandaRecomendada = document.getElementById('btnBarandaRecomendada');

            if (btnBarandaActual && btnBarandaRecomendada) {
                btnBarandaActual.addEventListener('click', () => {
                    btnBarandaActual.classList.add('active');
                    btnBarandaRecomendada.classList.remove('active');
                    vistaActual = 'actual';
                    dibujarBaranda();
                });

                btnBarandaRecomendada.addEventListener('click', () => {
                    btnBarandaActual.classList.remove('active');
                    btnBarandaRecomendada.classList.add('active');
                    vistaActual = 'recomendada';
                    dibujarBaranda();
                });
            }


            document.getElementById('btnDescargar').addEventListener('click', () => {
                // Track diagram download
                if (typeof gtag === 'function') {
                    gtag('event', 'download_diagram', {
                        event_category: 'Engagement',
                        event_label: 'Descargar Diagrama Calculadora'
                    });
                }

                const svgElement = document.getElementById('diagrama');
                if (!svgElement) return;
                const multiplier = 4;
                const svgData = new XMLSerializer().serializeToString(svgElement);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const svgSize = svgElement.viewBox.baseVal;
                canvas.width = svgSize.width * multiplier;
                canvas.height = svgSize.height * multiplier;

                const img = new Image();
                img.onload = () => {
                    ctx.fillStyle = "white";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    link.download = `la-tarima-diagrama-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    link.click();
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            });

            function initCalculator() {
                const last = loadMedidas();
                if (last.A != null) inputA.value = last.A;
                if (last.B != null) inputB.value = last.B;
                if (last.C != null) inputC.value = last.C;
                if (inputB.value !== '' && inputC.value !== '') {
                    ejecutar();
                }
            }

            if (document.readyState === 'loading') {
                window.addEventListener('DOMContentLoaded', initCalculator);
            } else {
                initCalculator();
            }
        })();
    </script>
</body>

</html>
