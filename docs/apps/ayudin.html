    <!-- Script Anti-FOUC para Temáticas e Iframe -->
    <script>
        (function() {
            try {
                // Temáticas
                var userSelected = localStorage.getItem('userSelectedTheme');
                var localTheme = localStorage.getItem('activeTheme');
                var themeToApply = userSelected || localTheme || 'classic';
                if (themeToApply && themeToApply !== 'classic') {
                    document.body.classList.add('theme-' + themeToApply);
                }
            } catch(e) {}
            
            // Iframe detection
            if (window.self !== window.top) {
                document.body.classList.add('in-iframe');
            }
        })();
    </script>
