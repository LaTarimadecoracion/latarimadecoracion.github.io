<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Música - LA TARIMA</title>
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    
    
    <link rel="stylesheet" href="css/style.css?v=25">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(160, 113, 91, 0.08);
            --blur-val: 20px;
        }

        /* En temas oscuros o sobrios podemos atenuar el glass */
        body.theme-sobrio {
            --glass-bg: rgba(15, 23, 42, 0.06);
            --glass-border: rgba(15, 23, 42, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(15, 23, 42, 0.05);
        }

        body {
            font-family: var(--font-main), sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        /* Auras de fondo premium */
        .bg-glow-music {
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(var(--primary-color-rgb, 160, 113, 91), 0.15) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
            filter: blur(40px);
            pointer-events: none;
        }
        .bg-glow-1 { top: -50px; right: -50px; }
        .bg-glow-2 { bottom: -50px; left: -50px; }

        .music-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-sizing: border-box;
        }

        /* Reproductor Premium "Sonando Ahora" */
        .player-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 1rem;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
        }

        /* Vinilo Rotatorio */
        .disc-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @media (min-height: 600px) {
            .disc-wrapper {
                width: 110px;
                height: 110px;
                margin-bottom: 0.75rem;
            }
        }

        .vinyl-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #050505 60%, #1a1a1a 70%, #000 100%);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3), inset 0 0 10px rgba(255,255,255,0.1);
            position: relative;
            animation: rotate-vinyl 15s linear infinite;
            animation-play-state: paused;
            transition: transform 0.5s ease-out;
        }

        /* Texturas del vinilo */
        .vinyl-disc::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 50%;
        }

        .vinyl-disc::after {
            content: '';
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 2px dashed rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .disc-center {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--primary-color);
            background-image: linear-gradient(135deg, var(--accent-color) 0%, var(--primary-color) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .disc-center-hole {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--bg-color);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        @keyframes rotate-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .track-info {
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .track-title {
            font-size: 1.05rem;
            font-weight: 800;
            margin: 0;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 5px;
        }

        .track-artist {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Barra de Progreso */
        .progress-area {
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
        }

        body.theme-sobrio .slider-container {
            background: rgba(15, 23, 42, 0.1);
        }

        .progress-bar-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--accent-color) 100%);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 4px;
        }

        /* Controles de Reproducción */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        .btn-control span {
            font-size: 20px;
        }

        .btn-control:hover {
            color: var(--primary-color);
            transform: scale(1.1);
            background: rgba(var(--primary-color-rgb, 160, 113, 91), 0.05);
        }

        .btn-control.active {
            color: var(--primary-color);
        }

        .btn-play-pause {
            background: var(--primary-color);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(var(--primary-color-rgb, 160, 113, 91), 0.25);
        }

        .btn-play-pause:hover {
            background: var(--primary-hover);
            color: #fff;
            transform: scale(1.08);
            box-shadow: 0 6px 15px rgba(var(--primary-color-rgb, 160, 113, 91), 0.35);
        }

        .btn-play-pause span {
            font-size: 24px;
        }

        /* Controles Auxiliares: Volumen */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 80%;
            max-width: 180px;
        }

        .volume-container span {
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        body.theme-sobrio .volume-slider {
            background: rgba(15, 23, 42, 0.1);
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        /* Playlist Wrapper */
        .playlist-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 0;
        }

        /* Selector de Categorías (Tabs) */
        .tabs-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            border: 1.5px solid var(--glass-border);
            border-radius: 50px;
            padding: 3px;
            display: flex;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: none;
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn span {
            font-size: 16px;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 3px 8px rgba(var(--primary-color-rgb, 160, 113, 91), 0.2);
        }

        /* Lista de Temas */
        .playlist-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 0.5rem;
            box-shadow: var(--glass-shadow);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .playlist-header {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .playlist-items {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
            min-height: 0;
        }

        /* Scrollbar styling */
        .playlist-items::-webkit-scrollbar {
            width: 4px;
        }
        .playlist-items::-webkit-scrollbar-thumb {
            background: rgba(var(--primary-color-rgb, 160, 113, 91), 0.2);
            border-radius: 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.5rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
            gap: 8px;
            border: 1px solid transparent;
        }

        .playlist-item:hover {
            background: rgba(var(--primary-color-rgb, 160, 113, 91), 0.05);
            transform: translateY(-1px);
        }

        .playlist-item.active {
            background: rgba(var(--primary-color-rgb, 160, 113, 91), 0.08);
            border-color: rgba(var(--primary-color-rgb, 160, 113, 91), 0.15);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .item-icon-play {
            color: var(--primary-color);
            font-size: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-text {
            min-width: 0;
        }

        .item-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }

        .item-meta {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 2px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .item-badge-demo {
            background: #fff0f6;
            color: #d53f8c;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.5px 3px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .item-duration {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Mini Ecualizador de Barras en el Item Sonando */
        .eq-bars {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 10px;
            width: 12px;
        }

        .playlist-item.active.playing .eq-bars {
            display: flex;
        }

        .eq-bar {
            width: 2px;
            background-color: var(--primary-color);
            border-radius: 1px;
            animation: bounce-bar 0.8s ease-in-out infinite alternate;
        }
        
        .eq-bar:nth-child(1) { height: 30%; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 60%; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.0s; }
        .eq-bar:nth-child(4) { height: 90%; animation-delay: 0.2s; }

        @keyframes bounce-bar {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        .playlist-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-muted);
            border: 2px dashed rgba(0,0,0,0.05);
            border-radius: var(--radius-md);
            margin: 10px;
        }

        .playlist-empty span {
            font-size: 2rem;
            opacity: 0.4;
            margin-bottom: 0.4rem;
        }

        .playlist-empty h4 {
            margin: 0;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .playlist-empty p {
            margin: 2px 0 0 0;
            font-size: 0.72rem;
        }

        /* Responsive Layout para Tablet / Desktop (Mantiene formato columna pero adapta tamaños) */
        @media (min-width: 768px) {
            .music-container {
                padding: 1.25rem;
                gap: 1rem;
                max-width: 650px;
                margin: 0 auto;
            }

            .player-card {
                padding: 1.5rem;
            }

            .disc-wrapper {
                width: 130px;
                height: 130px;
                margin-bottom: 1rem;
            }

            .disc-center {
                width: 44px;
                height: 44px;
            }

            .disc-center-hole {
                width: 10px;
                height: 10px;
            }

            .track-title {
                font-size: 1.2rem;
            }

            .track-artist {
                font-size: 0.85rem;
            }

            .controls {
                gap: 1.25rem;
                margin-bottom: 0.75rem;
            }

            .btn-control span {
                font-size: 24px;
            }

            .btn-play-pause {
                width: 52px;
                height: 52px;
            }

            .btn-play-pause span {
                font-size: 28px;
            }

            .progress-area {
                margin-bottom: 0.75rem;
            }

            .volume-container {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>

    
    <div class="bg-glow-music bg-glow-1"></div>
    <div class="bg-glow-music bg-glow-2"></div>

    <div class="music-container">
        
        
        <div class="player-card">
            <div class="disc-wrapper">
                <div class="vinyl-disc" id="vinyl-disc"></div>
                <div class="disc-center">
                    <div class="disc-center-hole"></div>
                </div>
            </div>
            
            <div class="track-info">
                <div class="track-title" id="player-title">Selecciona un tema</div>
                <div class="track-artist" id="player-artist">La Tarima Mixes</div>
            </div>

            
            <div class="progress-area">
                <div class="slider-container" id="slider-container">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
                <div class="time-labels">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            
            <div class="controls">
                <button class="btn-control" id="btn-shuffle" title="Aleatorio">
                    <span class="material-symbols-outlined">shuffle</span>
                </button>
                <button class="btn-control" id="btn-prev" title="Anterior">
                    <span class="material-symbols-outlined">skip_previous</span>
                </button>
                <button class="btn-control btn-play-pause" id="btn-play-pause" title="Reproducir">
                    <span class="material-symbols-outlined" id="play-pause-icon">play_arrow</span>
                </button>
                <button class="btn-control" id="btn-next" title="Siguiente">
                    <span class="material-symbols-outlined">skip_next</span>
                </button>
                <button class="btn-control" id="btn-repeat" title="Repetir">
                    <span class="material-symbols-outlined">repeat</span>
                </button>
            </div>

            
            <div class="volume-container">
                <span class="material-symbols-outlined" id="volume-icon">volume_up</span>
                <input type="range" min="0" max="100" value="80" class="volume-slider" id="volume-slider">
            </div>
        </div>

        
        <div class="playlist-wrapper">
            
            <div class="tabs-bar">
                <button class="tab-btn active" id="tab-terminados">
                    <span class="material-symbols-outlined">album</span>
                    <span>Terminados</span>
                </button>
                <button class="tab-btn" id="tab-demos">
                    <span class="material-symbols-outlined">experiment</span>
                    <span>Demos / Avances</span>
                </button>
            </div>

            
            <div class="playlist-card">
                <div class="playlist-header">
                    <span id="playlist-category-title">Listado de Temas</span>
                    <span id="playlist-track-count">0 temas</span>
                </div>
                
                <div class="playlist-items" id="playlist-items">
                    
                </div>

                
                <div class="playlist-empty" id="playlist-empty" style="display: none;">
                    <span class="material-symbols-outlined">music_off</span>
                    <h4>Sin enganchados en esta lista</h4>
                    <p>Sube tus archivos de música para verlos aquí.</p>
                </div>
            </div>
        </div>

    </div>

    
    <audio id="audio-element"></audio>

    <script>
        // Sincronizar Tema con el Body del Parent en tiempo real
        function applyParentTheme() {
            try {
                if (window.parent && window.parent.activeTheme) {
                    const themeName = window.parent.activeTheme;
                    document.body.className = ''; // Limpiar clases
                    if (themeName && themeName !== 'classic') {
                        document.body.classList.add(`theme-${themeName}`);
                    }
                    
                    // Extraer el color primario dinámico de los estilos computados del body para usar en RGB (para opacidades en CSS)
                    const computedStyle = window.getComputedStyle(document.body);
                    const primaryHex = computedStyle.getPropertyValue('--primary-color').trim();
                    if (primaryHex) {
                        const rgb = hexToRgb(primaryHex);
                        if (rgb) {
                            document.documentElement.style.setProperty('--primary-color-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
                        }
                    }
                }
            } catch (e) {
                console.warn("No se pudo sincronizar el tema con la ventana padre:", e);
            }
        }

        // Helper para convertir HEX a RGB
        function hexToRgb(hex) {
            hex = hex.replace(/^#/, '');
            if (hex.length === 3) {
                hex = hex.split('').map(char => char + char).join('');
            }
            if (hex.length !== 6) return null;
            const num = parseInt(hex, 16);
            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyParentTheme();
            setInterval(applyParentTheme, 1000);
        });

        // --- Lógica del Reproductor de Música ---
        const audio = document.getElementById('audio-element');
        const playPauseBtn = document.getElementById('btn-play-pause');
        const playPauseIcon = document.getElementById('play-pause-icon');
        const vinylDisc = document.getElementById('vinyl-disc');
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const shuffleBtn = document.getElementById('btn-shuffle');
        const repeatBtn = document.getElementById('btn-repeat');
        const sliderContainer = document.getElementById('slider-container');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeIcon = document.getElementById('volume-icon');
        
        const playerTitle = document.getElementById('player-title');
        const playerArtist = document.getElementById('player-artist');
        const tabTerminados = document.getElementById('tab-terminados');
        const tabDemos = document.getElementById('tab-demos');
        
        const playlistItemsContainer = document.getElementById('playlist-items');
        const playlistCategoryTitle = document.getElementById('playlist-category-title');
        const playlistTrackCount = document.getElementById('playlist-track-count');
        const playlistEmptyState = document.getElementById('playlist-empty');

        let dataMusic = { terminados: [], demos: [] };
        let currentPlaylist = [];
        let currentTrackIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let activeCategory = 'terminados';

        const localFallbackData = {
            terminados: [
                {
                    title: "Enganchado Cumbia Classic (Muestra Online)",
                    file: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                    date: new Date().toISOString().split('T')[0],
                    size: "6.2 MB",
                    isDemoTrack: true
                },
                {
                    title: "Retro Mix 90s (Muestra Online)",
                    file: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                    date: new Date().toISOString().split('T')[0],
                    size: "7.0 MB",
                    isDemoTrack: true
                }
            ],
            demos: [
                {
                    title: "Reggaeton Proyecto Nuevo (Muestra Online)",
                    file: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                    date: new Date().toISOString().split('T')[0],
                    size: "5.4 MB",
                    isDemoTrack: true
                },
                {
                    title: "Idea Melódica 2026 (Muestra Online)",
                    file: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                    date: new Date().toISOString().split('T')[0],
                    size: "5.0 MB",
                    isDemoTrack: true
                }
            ]
        };

        async function fetchTrackList() {
            try {
                const response = await fetch('Musica/list.json?t=' + Date.now());
                if (!response.ok) throw new Error('No se pudo leer list.json');
                dataMusic = await response.json();
            } catch (err) {
                console.warn('[Music Player] Usando fallback offline:', err);
                dataMusic = localFallbackData;
            }
            setCategory(activeCategory);
        }

        window.refreshTrackList = fetchTrackList;

        function setCategory(category) {
            activeCategory = category;
            if (category === 'terminados') {
                tabTerminados.classList.add('active');
                tabDemos.classList.remove('active');
                playlistCategoryTitle.textContent = "💿 Terminados y Mezclas";
                currentPlaylist = dataMusic.terminados || [];
            } else {
                tabTerminados.classList.remove('active');
                tabDemos.classList.add('active');
                playlistCategoryTitle.textContent = "🧪 Demos e Ideas de Taller";
                currentPlaylist = dataMusic.demos || [];
            }
            playlistTrackCount.textContent = `${currentPlaylist.length} temas`;
            renderPlaylist();
        }

        function renderPlaylist() {
            playlistItemsContainer.innerHTML = '';
            if (currentPlaylist.length === 0) {
                playlistEmptyState.style.display = 'flex';
                playlistItemsContainer.style.display = 'none';
                return;
            }
            playlistEmptyState.style.display = 'none';
            playlistItemsContainer.style.display = 'block';

            currentPlaylist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                if (index === currentTrackIndex && isPlayingTrackFromCurrentPlaylist()) {
                    item.classList.add('active');
                    if (isPlaying) item.classList.add('playing');
                }

                const displaySize = track.size ? ` • ${track.size}` : '';
                const displayDate = track.date ? ` • ${track.date}` : '';
                const isDemoBadge = track.isDemoTrack ? `<span class="item-badge-demo">Demo</span> ` : '';

                item.innerHTML = `
                    <div class="item-info">
                        <div class="item-icon-play">
                            <span class="material-symbols-outlined">${(index === currentTrackIndex && isPlayingTrackFromCurrentPlaylist() && isPlaying) ? 'pause' : 'play_arrow'}</span>
                        </div>
                        <div class="item-text">
                            <h4 class="item-title">${track.title}</h4>
                            <div class="item-meta">
                                ${isDemoBadge}
                                <span>Grabación${displayDate}${displaySize}</span>
                            </div>
                        </div>
                    </div>
                    <div class="item-right">
                        <div class="eq-bars">
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                        </div>
                        <span class="item-duration">${track.duration || 'mix'}</span>
                    </div>
                `;

                item.addEventListener('click', () => {
                    if (index === currentTrackIndex && isPlayingTrackFromCurrentPlaylist()) {
                        togglePlay();
                    } else {
                        playTrack(index);
                    }
                });

                playlistItemsContainer.appendChild(item);
            });
        }

        function isPlayingTrackFromCurrentPlaylist() {
            if (currentTrackIndex === -1) return false;
            const activeTrack = currentPlaylist[currentTrackIndex];
            if (!activeTrack) return false;
            return audio.src === activeTrack.file || audio.getAttribute('src') === activeTrack.file;
        }

        function playTrack(index) {
            if (index < 0 || index >= currentPlaylist.length) return;
            currentTrackIndex = index;
            const track = currentPlaylist[currentTrackIndex];
            audio.src = track.file;
            audio.load();
            playerTitle.textContent = track.title;
            playerArtist.textContent = activeCategory === 'terminados' ? 'Enganchado Terminado' : 'Avance / Demo';
            audio.play()
                .then(() => {
                    isPlaying = true;
                    updatePlayerUI();
                })
                .catch(err => {
                    console.error("Error al reproducir audio:", err);
                    isPlaying = false;
                    updatePlayerUI();
                });
        }

        function togglePlay() {
            if (currentTrackIndex === -1) {
                if (currentPlaylist.length > 0) playTrack(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play()
                    .then(() => {
                        isPlaying = true;
                    })
                    .catch(err => {
                        console.error("Error al reanudar audio:", err);
                    });
            }
            updatePlayerUI();
        }

        function updatePlayerUI() {
            if (isPlaying) {
                playPauseIcon.textContent = 'pause';
                vinylDisc.style.animationPlayState = 'running';
            } else {
                playPauseIcon.textContent = 'play_arrow';
                vinylDisc.style.animationPlayState = 'paused';
            }
            renderPlaylist();
        }

        function playNext() {
            if (currentPlaylist.length === 0) return;
            if (isRepeat) {
                playTrack(currentTrackIndex);
                return;
            }
            let nextIndex = currentTrackIndex + 1;
            if (isShuffle) {
                nextIndex = Math.floor(Math.random() * currentPlaylist.length);
            } else if (nextIndex >= currentPlaylist.length) {
                nextIndex = 0;
            }
            playTrack(nextIndex);
        }

        function playPrev() {
            if (currentPlaylist.length === 0) return;
            let prevIndex = currentTrackIndex - 1;
            if (isShuffle) {
                prevIndex = Math.floor(Math.random() * currentPlaylist.length);
            } else if (prevIndex < 0) {
                prevIndex = currentPlaylist.length - 1;
            }
            playTrack(prevIndex);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            const duration = audio.duration;
            if (duration) {
                const percent = (currentTime / duration) * 100;
                progressBarFill.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
            const items = playlistItemsContainer.querySelectorAll('.playlist-item');
            if (items[currentTrackIndex]) {
                const durationEl = items[currentTrackIndex].querySelector('.item-duration');
                if (durationEl) {
                    durationEl.textContent = formatTime(audio.duration);
                    currentPlaylist[currentTrackIndex].duration = formatTime(audio.duration);
                }
            }
        });

        audio.addEventListener('ended', () => {
            playNext();
        });

        playPauseBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', playNext);
        prevBtn.addEventListener('click', playPrev);
        
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active', isRepeat);
        });

        sliderContainer.addEventListener('click', (e) => {
            const width = sliderContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            audio.volume = val / 100;
            updateVolumeIcon(val);
        });

        function updateVolumeIcon(value) {
            if (value == 0) {
                volumeIcon.textContent = 'volume_off';
            } else if (value < 40) {
                volumeIcon.textContent = 'volume_mute';
            } else if (value < 80) {
                volumeIcon.textContent = 'volume_down';
            } else {
                volumeIcon.textContent = 'volume_up';
            }
        }

        let previousVolume = 80;
        volumeIcon.addEventListener('click', () => {
            if (audio.volume > 0) {
                previousVolume = volumeSlider.value;
                audio.volume = 0;
                volumeSlider.value = 0;
                updateVolumeIcon(0);
            } else {
                audio.volume = previousVolume / 100;
                volumeSlider.value = previousVolume;
                updateVolumeIcon(previousVolume);
            }
        });

        tabTerminados.addEventListener('click', () => {
            if (activeCategory !== 'terminados') setCategory('terminados');
        });

        tabDemos.addEventListener('click', () => {
            if (activeCategory !== 'demos') setCategory('demos');
        });

        fetchTrackList();
    </script>
</body>
</html>
