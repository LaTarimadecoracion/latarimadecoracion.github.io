<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando...</title>
    <script>
        (function() {
            var pathname = window.location.pathname.toLowerCase();
            if (pathname.endsWith('/')) pathname = pathname.slice(0, -1);

            var cleanPath = pathname;
            if (cleanPath.endsWith('.html')) {
                cleanPath = cleanPath.slice(0, -5);
            }

            var isMayorista = cleanPath.endsWith('/web/mayorista') || cleanPath.endsWith('/mayorista') || cleanPath.endsWith('/mayoristas');
            var isCalcular = cleanPath.endsWith('/web/calcular') || cleanPath.endsWith('/calcular') || cleanPath.endsWith('/calculador');
            var isMusica = cleanPath.endsWith('/musica') || cleanPath.endsWith('/music') || cleanPath.endsWith('/enganchados') || cleanPath.endsWith('/musicas');
            var isAyudin = cleanPath.endsWith('/ayudin') || cleanPath.endsWith('/help') || cleanPath.endsWith('/herramientas');
            var isEdit = cleanPath.endsWith('/web/edit') || cleanPath.endsWith('/edit') || cleanPath.endsWith('/editor') || cleanPath.endsWith('/web/editor');
            
            var basePath = '/';
            var segments = window.location.pathname.split('/').filter(Boolean);
            if (segments.length > 0) {
                if (segments[0].toLowerCase() === 'latarimadecoracion.github.io') {
                    basePath = '/latarimadecoracion.github.io/';
                }
            }

            // 🔍 Detectar si el último segmento de la URL es un número de orden (ej: /500102800 o /pedidos/500102800)
            var lastSegment = segments.length > 0 ? segments[segments.length - 1].replace('.html', '').trim() : '';
            var cleanDigits = lastSegment.replace(/[^0-9]/g, '');
            if (cleanDigits.length >= 6 && /^\d+$/.test(cleanDigits)) {
                window.location.replace(window.location.origin + basePath + '?view=pedidos&id=' + cleanDigits);
                return;
            }

            if (isMayorista) {
                window.location.replace(window.location.origin + basePath + 'mayorista.html');
            } else if (isCalcular) {
                window.location.replace(window.location.origin + basePath + '?view=calcular');
            } else if (isEdit) {
                window.location.replace(window.location.origin + basePath + 'Herramientas/editor-fotos.html');
            } else if (isAyudin) {
                window.location.replace(window.location.origin + basePath + '?view=ayudin');
            } else if (isMusica) {
                window.location.replace(window.location.origin + basePath + '?view=musica');
            } else {
                window.location.replace(window.location.origin + basePath);
            }
        })();
    </script>
</head>
<body>
    <p>Redireccionando...</p>
</body>
</html>
