<!-- =============================================================================
     partials/modal-volume-discounts.html
     Modal de Configuración de Descuentos por Cantidad (Global)
     Extraído de index.html — no modificar clases, IDs ni estilos inline
     ============================================================================= -->

    <!-- Modal Descuentos por Cantidad -->
    <div id="modal-volume-discounts" class="modal-overlay" style="display: none; align-items: center; justify-content: center; z-index: 9999;">
        <div class="modal-card" style="max-width: 500px; width: 90%; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <div class="modal-header" style="padding: 1rem 1.5rem; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 1.1rem; color: #0F172A;">Configurar Descuentos por Cantidad</h3>
                <button type="button" id="btn-close-volume-modal" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748B;">&times;</button>
            </div>
            <div class="modal-body" style="padding: 1.5rem;">
                <div style="display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 90px;">
                        <label style="display: block; font-size: 0.8rem; margin-bottom: 0.25rem;">Cant. Mínima</label>
                        <input type="number" id="vol-min-qty" min="2" style="width: 100%; padding: 8px; border: 1px solid #CBD5E1; border-radius: 6px;" placeholder="Ej: 10">
                    </div>
                    <div style="flex: 1; min-width: 120px;">
                        <label style="display: block; font-size: 0.8rem; margin-bottom: 0.25rem;">Tipo Descuento</label>
                        <select id="vol-discount-type" style="width: 100%; padding: 8px; border: 1px solid #CBD5E1; border-radius: 6px; background: white; height: 38px;">
                            <option value="percent">Porcentaje (%)</option>
                            <option value="fixed">Monto Fijo ($)</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 90px;">
                        <label id="lbl-vol-value" style="display: block; font-size: 0.8rem; margin-bottom: 0.25rem;">Descuento (%)</label>
                        <input type="number" id="vol-discount-pct" min="1" max="99" style="width: 100%; padding: 8px; border: 1px solid #CBD5E1; border-radius: 6px;" placeholder="Ej: 15">
                    </div>
                    <button type="button" id="btn-add-vol-rule" style="padding: 8px 16px; background: #0F172A; color: white; border: none; border-radius: 6px; cursor: pointer; height: 38px;">Agregar</button>
                </div>
                
                <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                    <thead>
                        <tr style="border-bottom: 1px solid #E2E8F0;">
                            <th style="text-align: left; padding: 8px;">A partir de...</th>
                            <th style="text-align: left; padding: 8px;">Descuento</th>
                            <th style="text-align: right; padding: 8px;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="vol-rules-tbody">
                        <!-- Reglas dinámicas -->
                    </tbody>
                </table>
                <p id="vol-rules-empty" style="text-align: center; color: #94A3B8; font-size: 0.85rem; margin-top: 1rem;">No hay descuentos configurados.</p>
            </div>
            <div class="modal-footer" style="padding: 1rem 1.5rem; border-top: 1px solid #E2E8F0; text-align: right; background: #F8FAFC;">
                <button type="button" id="btn-save-vol-modal" style="padding: 8px 24px; background: #0F172A; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Guardar y Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal Modificador de Precios Masivos -->
    <div id="modal-bulk-price-modifier" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 100000; align-items: center; justify-content: center; backdrop-filter: blur(2px);">
        <div style="background: white; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); overflow: hidden;">
            <div class="modal-header" style="padding: 16px 20px; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; background: #F8FAFC;">
                <h3 style="margin: 0; font-size: 1.1rem; color: #0F172A; font-weight: 600;">Modificar Precios</h3>
                <button type="button" id="btn-close-price-modifier" style="background: none; border: none; color: #64748B; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 4px;">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div style="padding: 20px;">
                <p id="price-modifier-title" style="margin: 0 0 16px 0; font-size: 0.9rem; color: #475569;"></p>
                <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                    <div style="flex: 1;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Acción</label>
                        <select id="price-mod-action" style="width: 100%; padding: 8px; border: 1.5px solid #E2E8F0; border-radius: 6px;">
                            <option value="increase">Aumentar (+)</option>
                            <option value="decrease">Descontar (-)</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Tipo</label>
                        <select id="price-mod-type" style="width: 100%; padding: 8px; border: 1.5px solid #E2E8F0; border-radius: 6px;">
                            <option value="percentage">Porcentaje (%)</option>
                            <option value="fixed">Monto Fijo ($)</option>
                        </select>
                    </div>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Valor</label>
                    <input type="number" id="price-mod-value" placeholder="Ej: 15" style="width: 100%; padding: 10px; border: 1.5px solid #E2E8F0; border-radius: 6px; font-size: 1rem; box-sizing: border-box;" min="0" step="any">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button type="button" id="btn-cancel-price-modifier" style="padding: 8px 16px; border: 1px solid #CBD5E1; background: white; border-radius: 6px; cursor: pointer; color: #475569; font-weight: 500;">Cancelar</button>
                    <button type="button" id="btn-apply-price-modifier" class="btn-primary" style="padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: 600;">Aplicar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear Nuevo Rubro -->
    <div id="admin-rubro-modal" class="modal-overlay" style="display: none; z-index: 100001; align-items: center; justify-content: center; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px);">
        <div class="modal-content" style="max-width: 400px; width: 90%;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.25rem;">
                <h3 id="admin-rubro-modal-title" style="font-size: 1.05rem; margin:0; font-weight:700; color:var(--text-main);">Crear Nuevo Rubro</h3>
                <button type="button" id="btn-cancel-rubro" class="btn-outline" style="padding:0.4rem 1rem; width:auto; font-size:0.85rem;">Cancelar</button>
            </div>
            <form id="admin-rubro-form" class="admin-form">
                <div class="form-group">
                    <label>ID del Rubro (Slug sin espacios)</label>
                    <input type="text" id="admin-rubro-id" placeholder="ej: pintureria" required style="width: 100%;">
                </div>
                <div class="form-group">
                    <label>Nombre del Rubro</label>
                    <input type="text" id="admin-rubro-name" placeholder="ej: Pinturería" required style="width: 100%;">
                </div>
                <div class="admin-actions mt-2 pt-2" style="border-top:1.5px solid #EEF0F3;">
                    <button type="button" id="btn-save-rubro" class="btn-primary" style="width: 100%; max-width: none;">Guardar Rubro</button>
                </div>
            </form>
        </div>
    </div>
