<!-- =============================================================================
     partials/modal-offer-detail.html
     Modal de Detalles de la Oferta / Combo (#offer-detail-modal)
     Extraído de index.html — no modificar clases, IDs ni estilos inline
     ============================================================================= -->

        <!-- Modal Detalle de Combo / Oferta -->
        <div id="offer-detail-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 10000; align-items: center; justify-content: center; padding: 1rem; overflow-y: auto;">
            <div class="modal-card" style="background: var(--bg-card, #ffffff); width: 100%; max-width: 520px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh;">
                <header style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color, #e5e7eb); display: flex; justify-content: space-between; align-items: center; background: #fafafa;">
                    <h3 id="offer-modal-detail-title" style="margin: 0; font-size: 1.1rem; font-weight: 900; color: var(--text-main);">
                        Detalles de la Oferta
                    </h3>
                    <button type="button" id="btn-close-offer-detail-modal" class="btn-close-modal" style="background: transparent; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
                </header>

                <div style="padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;">
                    <p id="offer-modal-detail-desc" style="font-size: 0.88rem; color: var(--text-muted); margin: 0; line-height: 1.4;"></p>

                    <div>
                        <h4 style="font-size: 0.85rem; font-weight: 800; color: var(--text-main); margin: 0 0 0.5rem 0;">📦 Productos Incluidos en este Combo:</h4>
                        <div id="offer-modal-items-list">
                            <!-- Items del combo -->
                        </div>
                    </div>

                    <div style="background: linear-gradient(135deg, #f0fdf4, #dcfce7); border: 1.5px solid #86efac; border-radius: 12px; padding: 1rem; text-align: center;">
                        <div style="font-size: 0.82rem; color: #166534; text-decoration: line-through; margin-bottom: 2px;">
                            Precio de lista: <span id="offer-modal-original-price">$0</span>
                        </div>
                        <div style="font-size: 1.6rem; font-weight: 900; color: #dc2626; margin-bottom: 4px;">
                            <span id="offer-modal-final-price">$0</span>
                        </div>
                        <div id="offer-modal-savings-tag" style="font-size: 0.88rem; font-weight: 800; color: #15803d;">
                            💰 ¡Ahorrás $0!
                        </div>
                        <div id="offer-modal-timer-pill" class="offer-countdown-pill" style="display: none; margin-top: 8px; font-size: 0.8rem; background: rgba(0,0,0,0.8); color: #fbbf24; padding: 4px 12px; border-radius: 20px; font-weight: 800; font-family: monospace;">
                            ⏳ Cargando...
                        </div>
                    </div>
                </div>

                <footer style="padding: 1rem 1.25rem; border-top: 1px solid var(--border-color, #e5e7eb); background: #fafafa; display: flex; gap: 10px;">
                    <button type="button" id="btn-add-combo-to-cart" class="admin-btn primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 800; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #c0510a, #e99f57); color: white; border: none; box-shadow: 0 4px 12px rgba(192,81,10,0.3);">
                        <span class="material-symbols-outlined">add_shopping_cart</span> Agregar Combo al Carrito
                    </button>
                </footer>
            </div>
        </div>
