<!-- =============================================================================
     partials/admin/modal-stock-draft.html
     Modal de Carga Rápida de Nuevo Producto (Borrador No Visible) (Admin)
     Extraído de index.html — no modificar clases, IDs ni estilos inline
     ============================================================================= -->

                        <!-- Modal de Carga Rápida de Nuevo Producto (Borrador No Visible) -->
                        <div id="admin-stock-create-modal" class="modal-overlay" style="display: none; z-index: 9999; backdrop-filter: blur(8px); background: rgba(15, 23, 42, 0.75);" onclick="if(event.target.id==='admin-stock-create-modal') window.closeAdminStockCreateModal()">
                            <div class="modal-content" style="max-width: 420px; width: 90%; padding: 1.5rem; overflow: hidden; border-radius: 20px; background: #0F172A; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); position: relative; color: white;">
                                
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                                    <h4 style="margin: 0; font-size: 1.05rem; font-weight: 800; color: #10B981; display: flex; align-items: center; gap: 6px;">
                                        <span class="material-symbols-outlined">add_box</span>
                                        Cargar Producto Rápido
                                    </h4>
                                    <button onclick="window.closeAdminStockCreateModal()" style="border: none; background: rgba(255,255,255,0.1); color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                                        <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
                                    </button>
                                </div>

                                <div style="font-size: 0.75rem; color: #94A3B8; margin-bottom: 1.25rem; background: rgba(255,255,255,0.04); padding: 8px 12px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.1);">
                                    🔒 <strong>Modo Borrador Privado</strong>: El producto se guardará como <em>no visible al público</em> para que lo edites tranquilamente.
                                </div>

                                <form id="admin-stock-create-form" onsubmit="window.saveAdminStockCreateProduct(event)" style="display: flex; flex-direction: column; gap: 0.85rem;">
                                    <!-- Categoría -->
                                    <div>
                                        <label style="display: block; font-size: 0.72rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; margin-bottom: 4px;">Categoría:</label>
                                        <select id="admin-stock-new-cat" onchange="window.updateAdminStockNewProdAutoId()" style="width: 100%; padding: 0.65rem; background: #1E293B; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-weight: 700; outline: none; font-size: 0.88rem;">
                                            <!-- Inyectado dinámicamente -->
                                        </select>
                                    </div>

                                    <!-- ID Asignado Automáticamente (Base36) -->
                                    <div>
                                        <label style="display: block; font-size: 0.72rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; margin-bottom: 4px;">Código de Producto (DNI Auto-Asignado):</label>
                                        <input type="text" id="admin-stock-new-id" readonly style="width: 100%; padding: 0.6rem; background: rgba(249, 115, 22, 0.1); border: 1px solid rgba(249, 115, 22, 0.3); border-radius: 8px; font-family: monospace; font-size: 1rem; font-weight: 800; color: #F97316; text-align: center;">
                                    </div>

                                    <!-- Nombre -->
                                    <div>
                                        <label style="display: block; font-size: 0.72rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; margin-bottom: 4px;">Nombre del Producto:</label>
                                        <input type="text" id="admin-stock-new-title" required placeholder="Ej: Mesa Matera Rústica" style="width: 100%; padding: 0.65rem; background: #1E293B; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-weight: 700; outline: none; font-size: 0.9rem;">
                                    </div>

                                    <!-- Grilla de Costo y Stock Inicial -->
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                                        <div>
                                            <label style="display: block; font-size: 0.72rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; margin-bottom: 4px;">Costo U. ($):</label>
                                            <input type="number" id="admin-stock-new-cost" min="0" step="100" placeholder="0" style="width: 100%; padding: 0.6rem; background: #1E293B; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #38BDF8; font-weight: 800; font-size: 1rem; text-align: center; outline: none;">
                                        </div>
                                        <div>
                                            <label style="display: block; font-size: 0.72rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; margin-bottom: 4px;">Stock Inicial:</label>
                                            <input type="number" id="admin-stock-new-qty" min="0" value="1" style="width: 100%; padding: 0.6rem; background: #1E293B; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: white; font-weight: 800; font-size: 1rem; text-align: center; outline: none;">
                                        </div>
                                    </div>

                                    <!-- Foto / Cámara Móvil -->
                                    <div>
                                        <label style="display: block; font-size: 0.72rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; margin-bottom: 4px;">Foto de Referencia (Cámara o Archivo):</label>
                                        <div style="display: flex; gap: 8px; align-items: center;">
                                            <!-- Input de archivo con capture="environment" para abrir la cámara directa en celulares -->
                                            <input type="file" id="admin-stock-new-photo-file" accept="image/*" capture="environment" style="display: none;" onchange="window.handleAdminStockCameraPhotoSelect(this)">
                                            
                                            <button type="button" onclick="document.getElementById('admin-stock-new-photo-file').click()" style="flex: 1; padding: 0.65rem; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; font-size: 0.82rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                                                <span class="material-symbols-outlined" style="font-size: 20px; color: #38BDF8;">photo_camera</span>
                                                <span id="admin-stock-new-photo-btn-text">📷 Tomar Foto / Elegir</span>
                                            </button>

                                            <!-- Previsualización -->
                                            <img id="admin-stock-new-photo-preview" src="img/logo_provisional.png" alt="Preview" style="width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2);">
                                        </div>
                                    </div>

                                    <button type="submit" style="width: 100%; padding: 0.85rem; font-size: 0.95rem; font-weight: 800; border-radius: 12px; background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: white; border: none; cursor: pointer; margin-top: 0.5rem; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);">
                                        ✨ Guardar Borrador Privado
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- Modal de Enlaces / Vista Web del Producto -->
                        <div id="admin-stock-links-modal" class="modal-overlay" style="display: none; z-index: 9999; backdrop-filter: blur(8px); background: rgba(15, 23, 42, 0.75);" onclick="if(event.target.id==='admin-stock-links-modal') window.closeAdminStockLinksModal()">
                            <div class="modal-content" style="max-width: 420px; width: 90%; padding: 1.5rem; border-radius: 20px; background: #0F172A; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: white; text-align: left;">
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.75rem;">
                                    <h4 style="margin: 0; font-size: 1.05rem; font-weight: 800; color: #38BDF8; display: flex; align-items: center; gap: 8px;">
                                        <span class="material-symbols-outlined">open_in_new</span>
                                        <span id="admin-stock-links-modal-title">Enlaces del Producto</span>
                                    </h4>
                                    <button onclick="window.closeAdminStockLinksModal()" style="border: none; background: rgba(255,255,255,0.1); color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                                        <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
                                    </button>
                                </div>

                                <p style="font-size: 0.8rem; color: #94A3B8; margin-top: 0; margin-bottom: 1rem; font-weight: 600;">
                                    Seleccioná una opción para abrir la vista pública del producto en una nueva pestaña:
                                </p>

                                <div id="admin-stock-links-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
                                    <!-- Inyectado dinámicamente -->
                                </div>
                            </div>
                        </div>
