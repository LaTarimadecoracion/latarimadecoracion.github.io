<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seguimiento de Pedidos | LA TARIMA</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css?v=25">
    
    <style>
        :root {
            --primary-hsl: 25, 30%, 45%;
            --primary-color: hsl(var(--primary-hsl));
            --surface-color: #ffffff;
            --bg-color: #faf9f6;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-sm: 0 4px 18px rgba(0, 0, 0, 0.015);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        
        .client-header {
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--surface-color);
            border-bottom: 1.5px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            box-sizing: border-box;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
        }
        
        .logo-img {
            height: 38px;
            width: auto;
        }
        
        .logo-text {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
        }
        
        .search-card {
            background: var(--surface-color);
            border-radius: var(--radius-lg);
            border: 1.5px solid var(--border-color);
            box-shadow: var(--shadow-md);
            max-width: 480px;
            width: 90%;
            padding: 2.5rem 2rem;
            text-align: center;
            box-sizing: border-box;
            margin-top: 5rem;
            margin-bottom: 5rem;
        }
        
        .search-card span.main-icon {
            font-size: 64px;
            color: var(--primary-color);
            margin-bottom: 1rem;
            display: block;
        }
        
        .search-card h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            font-weight: 800;
        }
        
        .search-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0 0 2rem 0;
            line-height: 1.5;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
        }
        
        .input-group span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        .input-control {
            width: 100%;
            box-sizing: border-box;
            padding: 0.8rem 1rem 0.8rem 45px !important;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            background: #f8fafc;
            transition: all 0.2s;
            text-align: center;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .input-control:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(180, 132, 108, 0.15);
        }
        
        .btn-search {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(180, 132, 108, 0.2);
        }
        
        .btn-search:hover {
            background: hsl(25, 30%, 38%);
            transform: translateY(-1px);
        }
        
        .error-message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            display: none;
            text-align: left;
            line-height: 1.4;
        }
        
        .client-footer {
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            background: var(--surface-color);
            border-top: 1.5px solid var(--border-color);
            padding: 1.5rem 2rem;
            text-align: center;
            box-sizing: border-box;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 0.75rem;
        }
        
        .social-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        
        .social-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }
        
        .footer-text {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        @media (max-height: 600px) {
            body {
                justify-content: flex-start;
                padding-top: 5.5rem;
                padding-bottom: 6rem;
            }
            .client-header, .client-footer {
                position: relative;
            }
            .search-card {
                margin: 2rem auto;
            }
        }

        /* Iframe Styles Override */
        body.in-iframe {
            background: transparent !important;
            justify-content: flex-start;
            padding: 0;
            min-height: auto;
            overflow: hidden;
        }
        body.in-iframe .client-header,
        body.in-iframe .client-footer {
            display: none !important;
        }
        body.in-iframe .search-card {
            margin: 0 auto;
            box-shadow: none;
            border: none;
            background: transparent;
            width: 100%;
            max-width: 100%;
            padding: 1.5rem 1rem;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="client-header">
        <a href="../" class="logo-container">
            <img src="../img/logo_provisional.png" alt="La Tarima Logo" class="logo-img">
            <span class="logo-text">LA TARIMA</span>
        </a>
        <div style="font-size: 0.88rem; font-weight: 600; color: var(--primary-color);">Seguimiento Online</div>
    </header>

    <!-- Tarjeta de Búsqueda -->
    <div class="search-card">
        <span class="material-symbols-outlined main-icon">local_shipping</span>
        <h2>¿Cómo viene tu pedido?</h2>
        <p>Ingresá el número de Orden que te brindamos al realizar tu compra para conocer el estado de fabricación de tu mueble.</p>
        
        <form id="search-form" onsubmit="handleSearch(event)">
            <div class="input-group">
                <span class="material-symbols-outlined">tag</span>
                <input type="text" id="order-id-input" class="input-control" placeholder="Número de Orden" autocomplete="off" required pattern="[0-9]+" title="Solo números de orden válidos">
            </div>
            
            <button type="submit" class="btn-search">
                <span class="material-symbols-outlined" style="font-size: 20px;">search</span>
                Buscar Pedido
            </button>
            
            <div id="error-box" class="error-message"></div>
        </form>
    </div>

    <!-- Footer -->
    <footer class="client-footer">
        <div class="social-icons" id="social-container">
            <!-- Se inyectan dinámicamente -->
        </div>
        <div class="footer-text">
            &copy; 2026 La Tarima. Todos los derechos reservados.
        </div>
    </footer>

    <!-- Importar site-config para enlaces sociales -->
    <script src="../js/site-config.js?v=5"></script>
    
    <script>
        // Aplicar temática
        (function() {
            try {
                const userSelected = localStorage.getItem('userSelectedTheme');
                const localTheme = localStorage.getItem('activeTheme');
                const themeToApply = userSelected || localTheme || 'classic';
                if (themeToApply && themeToApply !== 'classic') {
                    document.body.classList.add('theme-' + themeToApply);
                }
            } catch(e) {}
            
            // Detectar si está en un iframe
            if (window.self !== window.top) {
                document.body.classList.add('in-iframe');
            }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            // Renderizar enlaces de redes sociales
            renderSocialLinks();
        });
        
        function renderSocialLinks() {
            const container = document.getElementById('social-container');
            container.innerHTML = '';
            
            if (typeof siteConfig !== 'undefined' && siteConfig.socialLinks) {
                const links = siteConfig.socialLinks;
                
                if (links.instagram) {
                    container.innerHTML += `<a href="${links.instagram}" target="_blank" class="social-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a>`;
                }
                if (links.tiktok) {
                    container.innerHTML += `<a href="${links.tiktok}" target="_blank" class="social-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg></a>`;
                }
                if (links.facebook) {
                    container.innerHTML += `<a href="${links.facebook}" target="_blank" class="social-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg></a>`;
                }
                if (links.whatsapp) {
                    const waNum = links.whatsapp.replace(/[^0-9]/g, '');
                    container.innerHTML += `<a href="https://wa.me/${waNum}" target="_blank" class="social-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></a>`;
                }
            }
        }
        
        async function handleSearch(e) {
            e.preventDefault();
            const input = document.getElementById('order-id-input');
            const errorBox = document.getElementById('error-box');
            const orderId = input.value.trim();
            
            errorBox.style.display = 'none';
            
            if (!/^[0-9]+$/.test(orderId)) {
                showError('Ingrese un número de orden válido.');
                return;
            }
            
            try {
                // Hacer HEAD request para verificar si el archivo HTML del cliente existe
                const res = await fetch(`./${orderId}.html`, { method: 'HEAD' });
                if (res.ok) {
                    window.location.href = `./${orderId}.html`;
                } else {
                    showError('No se encontró el pedido o ya expiró (pasan 30 días hábiles desde que el pedido es finalizado). Por favor, verifica el número e intenta nuevamente o consúltanos por WhatsApp.');
                }
            } catch (err) {
                console.error(err);
                // Fallback por si falla HEAD request (por CORS u otras causas)
                window.location.href = `./${orderId}.html`;
            }
        }
        
        function showError(msg) {
            const errorBox = document.getElementById('error-box');
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
