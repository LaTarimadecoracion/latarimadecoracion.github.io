        function getOrderIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('id') && params.get('id').trim() !== '') {
                return params.get('id').trim();
            }
            // Soporte para links directos estilo /pedidos/500102800.html
            const pathname = window.location.pathname;
            const filename = pathname.substring(pathname.lastIndexOf('/') + 1);
            if (filename && filename !== 'index.html' && filename !== '') {
                return filename.replace('.html', '').trim();
            }
            return null;
        }

            if (!container) return;
            container.innerHTML = `

                    </div>

        function renderTimeline(order, milestonesCfg) {
            const timelineContainer = document.getElementById('timeline-container');
            if (!timelineContainer) return;

            const start = new Date(order.startDate || order.creationDate);
            const isEnvio = order.deliveryMethod === 'envio';
            const isFinished = (order.status === 'listo' || order.status === 'entregado');
            
            const minDays = Number(order.prepDaysMin || order.prepDays || 10);
            const maxDays = Number(order.prepDaysMax || order.prepDays || minDays);
            const extraDays = Number(order.extraDays || 0);
            const effectiveMaxDays = maxDays + extraDays;

            const rangeText = extraDays > 0 
                ? `${minDays} a ${effectiveMaxDays} días hábiles (+${extraDays}d de extensión)` 
                : (minDays === maxDays ? `${maxDays} días hábiles` : `${minDays} a ${maxDays} días hábiles`);

            // Determinar la fecha límite de fabricación
            let readyDate = new Date(order.estimatedReadyDate);
            if (isFinished) {
                readyDate = order.completedDate ? new Date(order.completedDate) : new Date();
            }

            // Construir los días de fabricación desde inicio hasta la fecha en que quedó listo/estimado
            const days = [];
            let curr = new Date(start);
            if (isFinished) {
                while (curr <= readyDate) {
                    days.push(new Date(curr));
                    curr.setDate(curr.getDate() + 1);
                }
            } else {
                let bDays = 0;
                while (bDays < effectiveMaxDays) {
                    days.push(new Date(curr));
                    if (curr.getDay() !== 0 && curr.getDay() !== 6) {
                        bDays++;
                    }
                    curr.setDate(curr.getDate() + 1);
                }
            }

            if (days.length === 0) {
                days.push(new Date(start));
            }

            // Agregar el hito final de Retiro/Despacho (atendiendo fines de semana)
            let pickupDate = new Date(days[days.length - 1]);
            pickupDate.setDate(pickupDate.getDate() + 1);
            
            // Si el día siguiente al listo cae en fin de semana, agregar sábado/domingo y luego el lunes como día de retiro
            while (pickupDate.getDay() === 0 || pickupDate.getDay() === 6) {
                days.push(new Date(pickupDate));
                pickupDate.setDate(pickupDate.getDate() + 1);
            }
            days.push(new Date(pickupDate)); // Día hábil de Retiro / Despacho

            const today = new Date();

            let businessDayCounter = 0;
            let minReadyDayIndex = -1;

            for (let i = 0; i < days.length - 1; i++) {
                const dayOfWeek = days[i].getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    businessDayCounter++;
                    if (!isFinished) {
                        if (businessDayCounter === minDays && minReadyDayIndex === -1) {
                            minReadyDayIndex = i;
                        }
                    }
                }
            }

            const actualBusinessDaysUsed = businessDayCounter;
            businessDayCounter = 0;

            const processedDays = days.map((d, index) => {
                const isFirst = index === 0;
                const isLast = index === days.length - 1;
                
                // El día en que queda listo es el último de la etapa de elaboración (justo antes de los fines de semana/retiro)
                let readyDayIdx = days.length - 2;
                while (readyDayIdx > 0 && (days[readyDayIdx].getDay() === 0 || days[readyDayIdx].getDay() === 6)) {
                    readyDayIdx--;
                }
                const isActualReadyDay = (index === readyDayIdx);

                const isMinReady = index === minReadyDayIndex;
                const isWeekend = d.getDay() === 0 || d.getDay() === 6;

                const isCompleted = isFinished || (d < today && !(d.toDateString() === today.toDateString()));
                const isToday = !isFinished && (d.toDateString() === today.toDateString());

                let itemClass = 'timeline-item';
                let iconText = 'schedule';

                if (isFirst) {
                    itemClass += ' milestone-start completed';
                    iconText = 'play_circle';
                } else if (isLast) {
                    itemClass += ' milestone-pickup';
                    if (isFinished) {
                        itemClass += ' completed-milestone';
                    }
                    iconText = isEnvio ? 'local_shipping' : 'storefront';
                } else if (isActualReadyDay && isFinished) {
                    itemClass += ' milestone-ready completed-milestone';
                    iconText = 'verified';
                } else if (isMinReady && minDays !== maxDays && !isFinished) {
                    itemClass += ' milestone-ready';
                    if (isCompleted) { itemClass += ' completed-milestone'; }
                    iconText = 'flag';
                } else {
                    if (!isWeekend) businessDayCounter++;
                    if (isCompleted) {
                        itemClass += ' completed';
                        iconText = 'check';
                    } else if (isToday) {
                        itemClass += ' active';
                        iconText = 'construction';
                    } else {
                        iconText = 'schedule';
                    }
                }

                const weekday = d.toLocaleDateString('es-AR', { weekday: 'long' });
                const capitalizedWeekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
                const dateStr = d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });

                let title = '';
                let desc  = '';

                if (isWeekend) {
                    title = `${capitalizedWeekday} &bull; ${dateStr}`;
                    desc  = 'Fines de semana el taller permanece cerrado 🌲';
                } else {
                    if (isFirst) {
                        title = `${capitalizedWeekday} &bull; ${dateStr} — Inicio`;
                        desc  = `Día 1 de fabricación en taller 🛠️`;
                    } else if (isActualReadyDay && isFinished) {
                        const readyDescCfg = milestonesCfg.readyDesc || '¡Tu pedido ya está listo! ✅';
                        const isEarly = actualBusinessDaysUsed < maxDays;
                        const earlyBadgeText = isEarly 
                            ? ` ⚡ ¡Finalizado con anticipación en solo ${actualBusinessDaysUsed} días hábiles! (Plazo previsto: ${rangeText}) 🎉` 
                            : ` (Finalizado en ${actualBusinessDaysUsed} días hábiles)`;
                        title = `${capitalizedWeekday} &bull; ${dateStr} — ${isEarly ? '¡Pedido Listo con Anticipación! ⚡' : '¡Pedido Finalizado!'}`;
                        desc  = `${readyDescCfg}${earlyBadgeText}`;
                    } else if (isActualReadyDay && !isFinished) {
                        title = `${capitalizedWeekday} &bull; ${dateStr} — Fin Estimado`;
                        desc  = extraDays > 0
                            ? `Fecha límite de elaboración estimada (Día ${businessDayCounter} de ${effectiveMaxDays} hábiles — incluye +${extraDays}d de ajuste)`
                            : `Fecha límite de elaboración estimada (Día ${businessDayCounter} de ${maxDays})`;
                    } else if (isMinReady && minDays !== maxDays && !isFinished) {
                        title = `${capitalizedWeekday} &bull; ${dateStr} — Inicio Rango Listo`;
                        desc  = `Primer día estimado de término (Día ${minDays} de ${effectiveMaxDays})`;
                    } else if (isLast) {
                        const customTitle = isEnvio ? (milestonesCfg.envioTitle || 'Despacho de Pedido') : (milestonesCfg.retiraTitle || 'Retiro por Taller');
                        const customDesc  = isEnvio
                            ? (milestonesCfg.envioDesc || 'Tu pedido se encuentra en proceso de despacho o en camino. Podés seguir su recorrido en el apartado de abajo ⬇️')
                            : (milestonesCfg.retiraDesc || 'Ya podés retirar tu pedido por nuestro domicilio. Coordinaremos el día y horario con vos 🏁');
                        title = `${capitalizedWeekday} &bull; ${dateStr} — ${customTitle}`;
                        desc  = customDesc;
                    } else {
                        title = `${capitalizedWeekday} &bull; ${dateStr}`;
                        desc  = businessDayCounter > maxDays && extraDays > 0
                            ? `Día ${businessDayCounter} de elaboración (+${extraDays}d de extensión en taller) 🛠️`
                            : `Día ${businessDayCounter} de elaboración`;
                    }
                }

                if (isToday && !isWeekend && !isFinished && !isLast) {
                    desc += ' (¡Hoy estamos trabajando en tu pedido! 🛠️)';
                }

                return { d, itemClass, iconText, title, desc, isFirst, isLast, isWeekend, isCompleted, isToday };
            });

            function createRow(dayData) {
                const row = document.createElement('div');
                row.className = dayData.itemClass;
                row.innerHTML = `
                    <div class="timeline-icon-wrapper">
                        <span class="material-symbols-outlined">${dayData.iconText}</span>
                    </div>
                    <div class="timeline-content">
                        <h4 class="timeline-title">${dayData.title}</h4>
                        <p class="timeline-desc">${dayData.desc}</p>
                    </div>
                `;
                return row;
            }

            // Si el pedido ya está listo/entregado, mostramos TODOS los días transcurridos hasta el retiro sin colapsar nada
            if (isFinished) {
                processedDays.forEach(dayData => {
                    timelineContainer.appendChild(createRow(dayData));
                });
                return;
            }

            const currentActiveIndex = processedDays.findIndex(day => day.isToday);
            const pivotIndex = currentActiveIndex !== -1 ? currentActiveIndex : processedDays.findIndex(day => !day.isCompleted);
            const actualPivot = pivotIndex !== -1 ? pivotIndex : processedDays.length - 1;

            const visibleCount = 5;
            let startIndex = Math.max(0, actualPivot - 1);
            let endIndex = startIndex + visibleCount;

            if (endIndex > processedDays.length) {
                endIndex = processedDays.length;
                startIndex = Math.max(0, endIndex - visibleCount);
            }

            const visibleDays = processedDays.slice(startIndex, endIndex);

            visibleDays.forEach(dayData => {
                timelineContainer.appendChild(createRow(dayData));
            });

            let expandedPrev = false;
            let expandedNext = false;

            if (startIndex > 0) {
                const hiddenPrevDays = processedDays.slice(0, startIndex);
                const prevWrapper = document.createElement('div');
                prevWrapper.style.display = 'none';
                hiddenPrevDays.forEach(dayData => prevWrapper.appendChild(createRow(dayData)));
                
                const prevBtn = document.createElement('button');
                prevBtn.className = 'timeline-expand-btn';
                prevBtn.innerHTML = `<span class="material-symbols-outlined">expand_less</span> Ver días anteriores (${hiddenPrevDays.length})`;
                prevBtn.onclick = () => {
                    expandedPrev = !expandedPrev;
                    prevWrapper.style.display = expandedPrev ? 'block' : 'none';
                    prevBtn.innerHTML = expandedPrev 
                        ? `<span class="material-symbols-outlined">expand_more</span> Ocultar días anteriores` 
                        : `<span class="material-symbols-outlined">expand_less</span> Ver días anteriores (${hiddenPrevDays.length})`;
                };
                
                timelineContainer.insertBefore(prevBtn, timelineContainer.firstChild);
                timelineContainer.insertBefore(prevWrapper, prevBtn.nextSibling);
            }

            if (endIndex < processedDays.length) {
                const hiddenNextDays = processedDays.slice(endIndex);
                const nextWrapper = document.createElement('div');
                nextWrapper.style.display = 'none';
                hiddenNextDays.forEach(dayData => nextWrapper.appendChild(createRow(dayData)));
                
                const nextBtn = document.createElement('button');
                nextBtn.className = 'timeline-expand-btn';
                nextBtn.innerHTML = `<span class="material-symbols-outlined">expand_more</span> Ver días siguientes (${hiddenNextDays.length})`;
                nextBtn.onclick = () => {
                    expandedNext = !expandedNext;
                    nextWrapper.style.display = expandedNext ? 'block' : 'none';
                    nextBtn.innerHTML = expandedNext 
                        ? `<span class="material-symbols-outlined">expand_less</span> Ocultar días siguientes` 
                        : `<span class="material-symbols-outlined">expand_more</span> Ver días siguientes (${hiddenNextDays.length})`;
                };
                
                timelineContainer.appendChild(nextBtn);
                timelineContainer.appendChild(nextWrapper);
            }
        }

        function renderNotFoundState(container, orderId) {
            document.title = 'Pedido No Encontrado | LA TARIMA';
            container.innerHTML = `
                <div class="not-found-card">
                    <span class="material-symbols-outlined" style="font-size: 64px; color: var(--primary-color); margin-bottom: 1rem;">search_off</span>
                    <h2 style="margin: 0 0 0.5rem 0; font-size: 1.35rem; font-weight: 800;">Pedido No Encontrado o Expirado</h2>
                    <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 1.5rem auto; font-size: 0.92rem; line-height: 1.5;">
                        No pudimos encontrar la orden <strong>#${escapeHtml(orderId || 'desconocida')}</strong>. Puede que el número sea incorrecto o que haya superado el tiempo de retención en taller.

                    <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">

                        <a href="https://wa.me/5491122334455" target="_blank" class="btn-outline" style="text-decoration: none; padding: 0.65rem 1.25rem; border-radius: 50px; font-weight: 700; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px;">

            `;
        }

        function copyTrackingCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                const el = document.getElementById('btn-copy-tracking');
                if (el) {
                    const originalHtml = el.innerHTML;
                    el.innerHTML = `¡Copiado! <span class="material-symbols-outlined" style="font-size: 16px;">check</span>`;
                    el.style.background = '#dcfce7';
                    el.style.color = '#15803d';
                    el.style.borderColor = '#86efac';
                    setTimeout(() => {
                        el.innerHTML = originalHtml;
                        el.style.background = '#eff6ff';
                        el.style.color = '#1d4ed8';
                        el.style.borderColor = '#bfdbfe';
                    }, 2000);
                }
            }).catch(err => {
                alert('Código de guía: ' + code);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
