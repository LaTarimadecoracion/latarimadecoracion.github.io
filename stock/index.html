<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=../?view=stock">
    <title>Redirigiendo a Control de Stock...</title>
    <script>
        (function() {
            var basePath = window.location.pathname.replace(/\/stock\/?$/i, '/');
            window.location.replace(window.location.origin + basePath + '?view=stock');
        })();
    </script>
</head>
<body>
    <p>Redirigiendo a <a href="../?view=stock">Control de Stock</a>...</p>
</body>
</html>
