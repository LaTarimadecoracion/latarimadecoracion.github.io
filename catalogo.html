<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Completo - LA TARIMA</title>
    
    <!-- PWA / Meta -->
    <meta name="theme-color" content="#FAF9F6">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="img/logo_provisional.png">

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Catálogo Completo - LA TARIMA">
    <meta property="og:description" content="Explorá nuestro catálogo completo A-Z con todos los productos, medidas, acabados y precios actualizados.">
    <meta property="og:image" content="https://latarimadecoracion.github.io/img/logo_provisional.png">
    <meta property="og:url" content="https://latarimadecoracion.github.io/catalogo.html">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Catálogo Completo - LA TARIMA">
    <meta name="twitter:description" content="Explorá nuestro catálogo completo A-Z con todos los productos, medidas, acabados y precios actualizados.">
    <meta name="twitter:image" content="https://latarimadecoracion.github.io/img/logo_provisional.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="stylesheet" href="css/catalogo.css?v=4">
</head>
<body>

    <!-- Auras de fondo premium -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="catalog-container">
        
        <!-- Cabecera -->
        <header class="catalog-header">
            <a href="index.html" class="catalog-back-btn" title="Volver al Inicio">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <h1 class="catalog-brand-title">LA TARIMA</h1>
            <p class="catalog-brand-subtitle">Catálogo de Productos A-Z</p>
        </header>

        <!-- Barra de Búsqueda -->
        <section class="catalog-search-section">
            <div class="catalog-search-wrapper">
                <span class="material-symbols-outlined catalog-search-icon">search</span>
                <input type="text" id="catalog-search-input" placeholder="Buscar por producto, categoría o etiqueta..." class="catalog-search-input" autocomplete="off">
            </div>
            <div id="catalog-results-counter" class="catalog-results-counter">Cargando catálogo...</div>
        </section>

        <!-- Listado de Productos -->
        <main id="catalog-list" class="catalog-list">
            <!-- Inyectado dinámicamente por js/catalogo.js -->
        </main>

        <!-- Estado Vacío -->
        <div id="catalog-empty-state" class="catalog-empty-state" style="display: none;">
            <span class="material-symbols-outlined">search_off</span>
            <h3>No encontramos coincidencias</h3>
            <p>Intentá buscando con otra palabra clave o categoría (ej: cama, baranda, sommier).</p>
        </div>

    </div>

    <!-- Scripts de datos y configuración global -->
    <script src="js/site-config.js?v=4"></script>
    <script src="js/products-data.js?v=4"></script>
    <script src="js/data.js?v=4"></script>
    <!-- Script de lógica específica de catálogo -->
    <script src="js/catalogo.js?v=4"></script>

</body>
</html>
