<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pistola Lector de Escáner Remoto - LA TARIMA</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            background: #1e293b;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1rem;
            color: #ffffff;
        }

        .live-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .main-content {
            flex: 1;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .viewport-container {
            width: 100%;
            aspect-ratio: 1;
            background: #000000;
            border-radius: 16px;
            border: 3px solid #38bdf8;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }

        .scan-status-card {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .scan-status-title {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .scan-status-value {
            font-size: 1.15rem;
            font-weight: 900;
            color: #38bdf8;
            word-break: break-all;
        }

        .count-badge {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-top: 6px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="header-title">
            <span class="material-symbols-outlined" style="color: #38bdf8;">phonelink</span>
            <span>Escáner Remoto Celular</span>
        </div>
        <div class="live-badge">
            <span style="width: 7px; height: 7px; background: #4ade80; border-radius: 50%; display: inline-block;"></span>
            VINCULADO
        </div>
    </div>

    <div class="main-content">
        <!-- Visor de la Cámara de Alta Precisión -->
        <div class="viewport-container">
            <div id="camera-reader-viewport" style="width: 100%; height: 100%;"></div>
        </div>

        <!-- Tarjeta de Estado del Último Escaneo -->
        <div class="scan-status-card">
            <div class="scan-status-title">Último Código Transmitido</div>
            <div id="scan-last-code" class="scan-status-value">Apuntá al código de barras o QR</div>
            <div id="scan-total-count" class="count-badge">Total transmitidos: 0</div>
        </div>

        <!-- Ajuste de Servidor / PC IP local -->
        <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-top: 10px; width: 100%; max-width: 440px;">
            <div style="font-size: 0.75rem; color: #94a3b8; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;">
                <span>🌐 IP / Servidor PC Local (Opcional):</span>
                <span id="ip-saved-indicator" style="color: #4ade80; display: none;">Guardado ✓</span>
            </div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="input-server-ip" placeholder="http://192.168.1.15:3000" style="flex: 1; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600;">
                <button type="button" onclick="saveServerIp()" style="background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; padding: 0 12px; font-weight: 800; font-size: 0.78rem; cursor: pointer;">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        let scannerInstance = null;
        let scanCounter = 0;
        let isProcessing = false;

        function playBeep() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.14, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.16);
                osc.start();
                osc.stop(ctx.currentTime + 0.16);
            } catch(e) {}
        }

        function sendCodeToPc(code) {
            if (!code || isProcessing) return;
            isProcessing = true;
            scanCounter++;

            document.getElementById('scan-last-code').textContent = `✅ ${code}`;
            document.getElementById('scan-total-count').textContent = `Total transmitidos: ${scanCounter}`;
            playBeep();

            // 1. Emitir vía API Server (HTTP / Red)
            try {
                const customServer = localStorage.getItem('tarima_remote_server_ip') || '';
                const apiUrl = customServer ? (customServer.endsWith('/') ? customServer + 'api/remote-scan' : customServer + '/api/remote-scan') : '/api/remote-scan';
                fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                }).catch(e => {});
            } catch(e) {}

            // 2. Emitir vía BroadcastChannel
            if ('BroadcastChannel' in window) {
                try {
                    const bc = new BroadcastChannel('tarima_remote_scanner');
                    bc.postMessage({ code: code, ts: Date.now() });
                } catch(e) {}
            }

            // 3. Emitir vía localStorage (Cross-tab)
            try {
                localStorage.setItem('tarima_remote_scan_signal', JSON.stringify({
                    code: code,
                    ts: Date.now(),
                    rand: Math.random()
                }));
            } catch(e) {}

            // Pausa de 1.2 segundos entre escaneos
            setTimeout(() => {
                isProcessing = false;
            }, 1200);
        }

        function initScanner() {
            if (typeof Html5Qrcode !== 'function') {
                document.getElementById('scan-last-code').textContent = '❌ Error cargando cámara';
                return;
            }

            scannerInstance = new Html5Qrcode("camera-reader-viewport");
            const config = { fps: 15, qrbox: { width: 240, height: 180 }, aspectRatio: 1.0 };

            scannerInstance.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    sendCodeToPc(decodedText);
                },
                (err) => {}
            ).catch(err => {
                scannerInstance.start(
                    { facingMode: "user" },
                    config,
                    (decodedText) => {
                        sendCodeToPc(decodedText);
                    }
                ).catch(err2 => {
                    document.getElementById('scan-last-code').textContent = '❌ Permiso de cámara denegado';
                });
            });
        }

        function saveServerIp() {
            const input = document.getElementById('input-server-ip');
            if (input) {
                const val = (input.value || '').trim();
                localStorage.setItem('tarima_remote_server_ip', val);
                const ind = document.getElementById('ip-saved-indicator');
                if (ind) {
                    ind.style.display = 'inline';
                    setTimeout(() => ind.style.display = 'none', 2000);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('tarima_remote_server_ip');
            if (saved) {
                const input = document.getElementById('input-server-ip');
                if (input) input.value = saved;
            }
            initScanner();
        });
    </script>
</body>
</html>
